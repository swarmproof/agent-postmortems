name: publish

on:
  push:
    branches: [main]
    paths:
      - "incidents/**"
      - "schema/**"
      - "scripts/**"

permissions:
  contents: write

# Serialize publish runs: merging several PRs in quick succession otherwise fires
# concurrent runs that race to push export commits to main (non-fast-forward).
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # G-ARCHIVE — backfill Wayback snapshots for sources lacking archive_url
      - name: Backfill source archives
        run: uv run scripts/check_links.py --backfill
        continue-on-error: true # archive.org outages must not block publishing

      # Rebuild the machine-readable exports (incidents / scenarios / seeds)
      - name: Build exports
        run: uv run scripts/build_exports.py

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add incidents export
          git diff --cached --quiet && { echo "no changes to publish"; exit 0; }
          git commit -m "chore(export): refresh exports and source archives [skip ci]"
          # Integrate any concurrent commits before pushing (belt-and-braces with the
          # concurrency group), retrying rebase+push a few times on races.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed; retrying"; sleep 3
          done
          echo "publish push failed after retries"; exit 1
