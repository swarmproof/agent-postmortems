name: weekly-coverage

# Completeness critic (S5): diff our corpus against curated external agent-incident
# lists and file the gaps as a tracking issue. Zero secrets — default GITHUB_TOKEN.
# Nothing is added to the corpus automatically; the issue is a triage list.

on:
  schedule:
    - cron: "0 9 * * 3" # Wednesdays 09:00 UTC (mid-week, offset from discovery)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Compute coverage gaps
        run: |
          uv run scripts/coverage_gaps.py --markdown --limit 60 > gaps.md
          uv run scripts/coverage_gaps.py --json gaps.json --limit 60
          echo "count=$(python3 -c 'import json;print(len(json.load(open("gaps.json"))))')" >> "$GITHUB_OUTPUT"
        id: gaps

      - name: Open or update the coverage-gaps issue
        if: steps.gaps.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('gaps.md', 'utf8')
              + `\n\n---\n_Generated by \`weekly-coverage\` on ${new Date().toISOString().slice(0,10)}. `
              + `These are agent incidents curated external lists have that our corpus does not — `
              + `draft the in-scope ones from \`incidents/_TEMPLATE.yaml\`. Some entries are surveys/reports, not incidents; triage as usual._`;
            const title = 'Coverage gaps vs external agent-incident sources';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'coverage',
            });
            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['coverage'],
              });
            }
