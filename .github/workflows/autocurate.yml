name: weekly-autocurate

# Layer 2 (opt-in) of the curation pipeline: after discovery, run Claude Code to
# research each new candidate, draft a schema-valid incident, validate it, and open a
# REVIEW pull request. Never merges — a human approves. Dormant until the
# ANTHROPIC_API_KEY secret is set (the guard job skips everything otherwise).

on:
  schedule:
    - cron: "0 10 * * 1" # Mondays 10:00 UTC, one hour after weekly-discovery
  workflow_dispatch:
    inputs:
      max_candidates:
        description: "Max candidates to draft this run"
        default: "5"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT";
          else echo "enabled=false" >> "$GITHUB_OUTPUT";
            echo "::notice::ANTHROPIC_API_KEY not set — auto-draft layer is dormant. Layer 1 (weekly-discovery) still runs."; fi

  autocurate:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create-pull-request pushes the review branch
      pull-requests: write   # and opens the review PR
    steps:
      # The drafting agent reads untrusted web content and has Bash, so the job
      # token is not left in .git/config for it; create-pull-request
      # authenticates with its own token input.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Discover candidates
        env:
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '5' }}
        run: |
          case "$MAX_CANDIDATES" in ''|*[!0-9]*) echo "::error::max_candidates must be a number"; exit 1;; esac
          uv run scripts/discover_incidents.py --json candidates.json --limit "$MAX_CANDIDATES"

      # Exact version (the publisher's stable tag when pinned) so a run never
      # picks up an unreviewed release; bump deliberately.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.311

      - name: Draft incidents from candidates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat .github/curation-prompt.md)" \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch" \
            --permission-mode acceptEdits

      # The agent may only add files under incidents/. Anything else it changed
      # or created (validators, schema, tool config, candidates.json) is reset
      # first, so the gates below run the committed tooling, not edited copies.
      - name: Discard changes outside incidents/
        run: |
          git checkout HEAD -- . ':(exclude)incidents'
          git clean -ffdx -- . ':(exclude)incidents'

      - name: Validate drafts (fail-closed)
        run: |
          uv run scripts/validate.py
          uv run scripts/check_links.py

      - name: Open review PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: bot/incident-candidates
          title: "Auto-drafted incident candidates for review"
          commit-message: "feat(corpus): auto-drafted incident candidates"
          labels: needs-review
          add-paths: incidents/*.yaml
          delete-branch: true
          body: |
            Auto-drafted by `weekly-autocurate` from the discovery feed. **Do not merge
            without review.** Each incident must be checked against the sourcing and
            neutrality rules in `CONTRIBUTING.md` and the PR checklist below.

            CI has already run the schema, taxonomy, id, link-liveness and neutrality
            gates on these drafts, but automated validation is not editorial review —
            verify sources, tone, and incident-vs-hazard labels by hand before merging.
