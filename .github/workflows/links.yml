name: weekly-links

# Link-rot sentinel: re-probe every sources[].url in the corpus, backfill missing
# archive_url values from the Wayback Machine, and file the dead links as a
# tracking issue. The daily publish job also backfills on merge, but Wayback
# throttling leaves gaps that nothing else revisits; this is the revisit.
# Nothing is removed or rewritten for a dead link (ADR-0008): the archive_url is
# the permanence mechanism (ADR-0004), and a maintainer decides what to do with
# a citation that has lost both its primary and its archive.

on:
  schedule:
    # Fridays 09:00 UTC — offset from publish (daily 07:00), discovery (Mon 09:00),
    # autocurate (Mon 10:00) and coverage (Wed 09:00).
    - cron: "0 9 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Share the publish job's group so the two workflows never push to main at the
# same time. This run queues behind an in-flight publish rather than cancelling
# it; a publish that starts mid-run cancels this one, and the next Friday run
# catches up.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5

      # Probe the whole corpus and backfill archives from the LATEST main, then
      # fast-forward push the new archive_url values. Same reset/rebuild/push
      # loop as publish.yml: each attempt resets to origin/main, re-runs the
      # check, and retries on a losing race. The probe log is kept outside the
      # tracked tree for the issue step below; a hard reset leaves it in place.
      - name: Re-check links and backfill archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          recheck() {
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            uv run scripts/check_links.py --backfill 2>&1 | tee links.log || true   # dead links are reported, never fatal
            git add incidents
            if git diff --cached --quiet; then echo "no new archives"; return 0; fi
            git commit -m "chore(links): backfill source archives [skip ci]"
            git push origin HEAD:main
          }
          for i in 1 2 3 4 5; do
            if recheck; then ok=1; break; fi
            echo "backfill attempt $i lost a race; retrying"; sleep 5
          done
          [ -n "$ok" ] || { echo "backfill push failed after retries"; exit 1; }

      # FAIL lines are dead primaries with no reachable archive (check_links.py
      # prints "FAIL [incident_id] url (detail)"). One reused issue, labelled
      # link-rot, lists them; when none remain, the issue is closed with a note.
      - name: Open, update or close the dead-links issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dead = fs.readFileSync('links.log', 'utf8').split('\n')
              .map(line => line.match(/^FAIL \[([^\]]+)\] (\S+) \((.*)\)$/))
              .filter(Boolean)
              .map(m => ({ id: m[1], url: m[2], detail: m[3] }));
            const { owner, repo } = context.repo;
            const today = new Date().toISOString().slice(0, 10);
            const title = 'Dead source links';
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'link-rot',
            });
            if (dead.length) {
              const lines = dead.map(d =>
                `- [\`${d.id}\`](https://github.com/${owner}/${repo}/blob/main/incidents/${d.id}.yaml) ${d.url} (${d.detail})`);
              const body = `${dead.length} source link(s) answered dead or stayed unreachable, with no reachable \`archive_url\` on file.\n\n`
                + lines.join('\n')
                + `\n\n---\n_Generated by \`weekly-links\` on ${today}. `
                + `Records are never removed for a dead link (ADR-0008). For each entry, find a Wayback or other `
                + `archive snapshot and add it as \`archive_url\`, add a replacement source, or annotate the record; `
                + `re-run \`uv run scripts/check_links.py incidents/<id>.yaml\` to confirm._`;
              if (existing.data.length) {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.data[0].number, body,
                });
              } else {
                await github.rest.issues.create({
                  owner, repo, title, body, labels: ['link-rot'],
                });
              }
            } else if (existing.data.length) {
              const issue_number = existing.data[0].number;
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `All source links are reachable or archived as of ${today} (\`weekly-links\`). Closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number, state: 'closed', state_reason: 'completed',
              });
            }
