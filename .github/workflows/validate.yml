name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the link gate diffs a pull request against its base
      - uses: astral-sh/setup-uv@v5

      # G-SCHEMA, G-TAX, G-ID, G-NEUTRAL, G-DRIFT — corpus-wide, fail-closed
      - name: Validate corpus
        run: uv run scripts/validate.py

      # Meta-test: fixtures must pass/fail exactly as expected ("test the tests")
      - name: Validate fixtures
        run: uv run scripts/validate.py --fixtures

      # G-MAP — framework mappings are derived from the crosswalk, not hand-edited
      - name: Check framework mappings
        run: uv run scripts/apply_mappings.py --check

      # G-LINK — every sources[].url reachable (403/429 warn as likely bot-blocks;
      # timeouts on a source with an archive_url warn). A pull request checks only
      # the records it changes, so a flaky third-party host behind an unrelated
      # record cannot fail it; pushes to main still check the whole corpus.
      - name: Check source links
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'incidents/*.yaml' | grep -v '/_' || true)
            if [ -n "$changed" ]; then
              echo "scoped to changed records:"; echo "$changed"
              echo "$changed" | xargs uv run scripts/check_links.py
              exit $?
            fi
            echo "no incident records changed; checking the whole corpus"
          fi
          uv run scripts/check_links.py

      # G-EXPORT — exports build cleanly and validate against their schemas.
      # We do NOT require exports to be committed in the PR: export/*.json are
      # generated artifacts, regenerated and committed on main by publish.yml.
      # Committing them per-PR causes merge conflicts between branches.
      - name: Build and validate exports
        run: uv run scripts/build_exports.py

      # G-SITE — the static site builds from every incident (smoke test; the
      # pages.yml workflow does the real build + deploy on main).
      - name: Build site (smoke)
        run: uv run scripts/build_site.py
