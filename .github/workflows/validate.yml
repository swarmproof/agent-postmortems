name: validate

on:
  pull_request:
  push:
    branches: [main]

# Runs on pull requests from forks: read-only token, no write scopes anywhere.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the link gate diffs a pull request against its base
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # G-SCHEMA, G-TAX, G-ID, G-NEUTRAL, G-DRIFT — corpus-wide, fail-closed
      - name: Validate corpus
        run: uv run scripts/validate.py

      # Meta-test: fixtures must pass/fail exactly as expected ("test the tests")
      - name: Validate fixtures
        run: uv run scripts/validate.py --fixtures

      # G-MAP — framework mappings are derived from the crosswalk, not hand-edited
      - name: Check framework mappings
        run: uv run scripts/apply_mappings.py --check

      # G-LINK — every sources[].url reachable (403/429 warn as likely bot-blocks;
      # timeouts on a source with an archive_url warn). A pull request checks only
      # the records it changes, so a flaky third-party host behind an unrelated
      # record cannot fail it; pushes to main still check the whole corpus.
      - name: Check source links
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- 'incidents/*.yaml' | grep -v '/_' || true)
            if [ -n "$changed" ]; then
              echo "scoped to changed records:"; echo "$changed"
              echo "$changed" | xargs uv run scripts/check_links.py
              exit $?
            fi
            echo "no incident records changed; checking the whole corpus"
          fi
          uv run scripts/check_links.py

      # G-EXPORT — exports build cleanly and validate against their schemas.
      # We do NOT require exports to be committed in the PR: export/*.json are
      # generated artifacts, regenerated and committed on main by publish.yml.
      # Committing them per-PR causes merge conflicts between branches.
      - name: Build and validate exports
        run: uv run scripts/build_exports.py

      # G-SITE — the static site builds from every incident (smoke test; the
      # pages.yml workflow does the real build + deploy on main).
      - name: Build site (smoke)
        run: uv run scripts/build_site.py

  # Unit tests under tests/ (feed, release, ...). Exit code 5 means pytest
  # collected nothing, which is not a failure while the suite is being built up.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # feed tests date records from git history
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Run tests
        run: |
          rc=0
          uv run --with pytest --with pyyaml --with jsonschema pytest -q tests/ || rc=$?
          if [ "$rc" -eq 5 ]; then echo "::notice::no tests collected under tests/"; exit 0; fi
          exit "$rc"

  # G-SECRETS — scan the commits this pull request or push introduces. gitleaks is
  # fetched as a pinned release binary and checked against its published sha256
  # (the gitleaks-action wrapper needs a license key on organisation accounts).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan new commits for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "scanning $range"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$range" .
