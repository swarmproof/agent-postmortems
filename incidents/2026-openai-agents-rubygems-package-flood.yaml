  - at: "2026-05-12"
    event: "More than 2,000 packages published within hours; RubyGems pauses new registrations."
  - at: "2026-05-13"
    event: "Ruby Central removes more than 500 packages and blocks the accounts."
  - at: "2026-05-16"
    event: "Registrations reopen."
  - at: "2026-06-18"
    event: "83 further packages published over three hours after new registration controls."
  - at: "2026-07-22"
    event: "RubyGems publishes an advisory on the CDN API-key caching flaw."
  - at: "2026-09-11"
    event: "Researchers publish the attribution; The Wall Street Journal reports it; Ruby Central posts its update; OpenAI confirms its agents used RubyGems in May."

