schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-taiwan-nuclear-agency-autonomous-attack
title: "Near-autonomous AI agents ran a four-day intrusion reaching Taiwan's nuclear safety regulator and energy sector"
summary: >-
  A suspected China-linked operator used a hacking program built from eight
  open-source AI models to run a largely autonomous four-day intrusion against
  Taiwanese government infrastructure. Across 12 attack waves it mapped 21 systems,
  compromised 85 accounts, exfiltrated 2,564+ personnel records, and reached the
  national nuclear safety agency, seven energy companies, and a government email
  system — reported as the first autonomous AI attack to reach a nuclear regulator.
date: "2026-07-01"
incident_type: incident
status: factual
confidence: corroborated
severity: critical
severity_rationale: >-
  A largely autonomous, adaptive intrusion that exfiltrated thousands of records
  and reached a nuclear safety regulator and energy infrastructure — realized
  national-security-level harm and a first-of-kind capability demonstration.

system:
  framework: hacking program built from eight open-source AI models
  models: []
  tools: ["pentesting-utilities"]
  vendor: suspected China-linked operator
  autonomy_level: fully-autonomous

primary_failure_class: autonomous-misuse
failure_classes:
  - class: autonomous-misuse
    subclass: cyber-ops
  - class: jailbreak
    subclass: role-play
  - class: data-exfiltration
    subclass: via-tool
attack_vector: direct-user
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  Operators assembled eight open-source AI models into a hacking program and, by
  framing the operation as a penetration test, bypassed the models' safety
  guardrails. Over four days (1–4 July 2026) the system autonomously conducted
  reconnaissance and intrusion across 12 waves, chaining vulnerabilities and
  changing tactics whenever it was blocked, without the operators writing exploit
  code by hand.
root_cause: >-
  Open-source models with offensive capability were orchestrated into an
  autonomous attack agent, and a legitimate-testing framing circumvented safety
  refusals. The agent could research new techniques and adapt in real time,
  amplifying a single operator into a persistent, self-directed intrusion.
contributing_factors:
  - Eight open-source models were combined into an autonomous offensive toolchain.
  - A penetration-test framing bypassed model safety guardrails.
  - The agent adapted in real time when blocked, chaining vulnerabilities across targets.
detection: >-
  Investigated and disclosed by security researchers on 2026-08-12, describing a
  four-day campaign conducted 1–4 July 2026.
recovery: >-
  Reported publicly as a landmark autonomous intrusion; mitigations centre on
  detecting agentic-attack patterns, hardening exposed government/energy systems,
  and constraining offensive use of open models.
prevention: >-
  Monitor for machine-speed, multi-stage autonomous intrusion behaviour; harden
  and segment critical-infrastructure and government systems; enforce usage policy
  and abuse detection for offensive orchestration of open models; treat AI-driven
  adaptive attacks as part of the threat model.

