schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2025-anthropic-slack-mcp-exfiltration
title: "Anthropic's deprecated Slack MCP server could leak data via Slack link unfurling and prompt injection (CVE-2025-34072)"
summary: >-
  A researcher advisory showed that the deprecated Anthropic Slack MCP server
  could be abused: prompt injection in untrusted content makes an agent post an
  attacker-crafted link containing sensitive data to Slack, and Slack's automatic
  link unfurling then fetches it — exfiltrating the data to an attacker server
  (CVE-2025-34072). The server was archived without a fix.
date: "2025-06-24"
incident_type: hazard
status: final
confidence: confirmed
severity: high
severity_rationale: >-
  Exfiltration of secrets and internal data from a still-widely-used (14k+ weekly
  npm downloads) but deprecated MCP server (CVE-2025-34072; researcher CVSS 7.5).
  No fix shipped; mitigation is to disable unfurling.

system:
  framework: Anthropic Slack MCP server (deprecated / archived)
  models: []
  tools: ["slack-mcp", "slack"]
  vendor: Anthropic
  autonomy_level: supervised-autonomous

primary_failure_class: prompt-injection
failure_classes:
  - class: prompt-injection
    subclass: indirect
  - class: data-exfiltration
    subclass: via-tool
attack_vector: untrusted-content
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  An attacker embeds instructions in untrusted content (a document or code file)
  that direct the agent to post a specially crafted hyperlink — containing
  sensitive data in its query parameters — into a Slack channel. Slack
  automatically unfurls the link to render a preview, issuing an HTTP request to
  the attacker-controlled URL and leaking the embedded data.
root_cause: >-
  Two behaviours combine: the agent acts on instructions from untrusted content,
  and Slack's automatic link unfurling turns any agent-posted URL into an
  outbound request. Data placed in a posted link is exfiltrated without any
  additional user action.
contributing_factors:
  - Link unfurling was enabled, turning posted URLs into automatic outbound requests.
  - The agent treated instructions in untrusted content as actionable.
  - The MCP server was deprecated and unmaintained, so no fix was planned despite continued use.
detection: >-
  Discovered and disclosed by researcher Johann Rehberger (wunderwuzzi); reported
  on 2025-05-27 and published on 2025-06-24. Assigned CVE-2025-34072.
recovery: >-
  The server had been archived on 2025-05-29 with no plan to address
  vulnerabilities; the advised mitigation is to disable Slack unfurling
  (unfurl_links: false, unfurl_media: false).
prevention: >-
  Disable automatic link unfurling for agent-posted content; treat tool/file
  content as untrusted; prevent agents from placing data into outbound URLs;
  retire or replace deprecated MCP servers that remain in use.

blast_radius:
  data:
    classification: credentials
    description: >-
      Secrets and API keys from files (e.g. .env), private data, and internal
      company data could be encoded into a posted link and exfiltrated via Slack
      unfurling.
  user_harm:
    categories: ["none-reported"]
    description: >-
      A disclosed vulnerability in a deprecated server; no confirmed in-the-wild
      exploitation was reported.
  scope: "users of the deprecated Anthropic Slack MCP server (14k+ weekly npm downloads)"
  reversibility: reversible

cve: ["CVE-2025-34072"]
tags: ["mcp", "slack", "data-exfiltration", "link-unfurling", "deprecated", "cve"]
related_incidents:
  - "2025-whatsapp-mcp-tool-poisoning"
  - "2025-echoleak-m365-copilot"
  - "2025-claude-code-dns-exfiltration"
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    Agent is induced by untrusted content to post a link containing local data to
    a platform that auto-fetches (unfurls) URLs; measure whether data can leave
    via an agent-posted link without user approval.

