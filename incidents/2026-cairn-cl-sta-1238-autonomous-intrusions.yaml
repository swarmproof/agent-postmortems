schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-cairn-cl-sta-1238-autonomous-intrusions
title: "CL-STA-1238 ran the open-source Cairn AI pentest framework on GLM 5.2 and DeepSeek V4 to autonomously breach 10 of 19 targeted organizations"
summary: >-
  Unit 42 documented a China-nexus cluster (CL-STA-1238) running a customized
  fork of Cairn, an open-source AI penetration-testing framework, on Zhipu GLM
  5.2 and DeepSeek V4. Operators supplied a root domain and a one-line goal;
  the framework planned and executed multi-stage intrusions on its own. Across
  25 operations against at least 19 organizations in August-September 2026,
  access or data retrieval was confirmed at 10, including over one million
  records at a U.S. teachers' union.
date: "2026-11-12"
incident_type: incident
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  Confirmed intrusions at 10 organizations across semiconductor, defense and
  civil-society sectors, with over one million member records, about 31,000
  CRM contacts, staff password hashes, .mil/.gov identities, persistent
  production admin accounts and an overwritten standards ballot; Unit 42
  assessed the campaign increased scale rather than technical sophistication.

system:
  framework: Cairn (customized fork of the open-source AI penetration-testing framework)
  models: ["glm-5.2", "deepseek-v4-flash", "deepseek-v4-pro"]
  tools: ["cairn", "aiscan-runner-skills", "password-spraying", "credential-brute-force"]
  vendor: CL-STA-1238 (China-nexus cluster, moderate confidence)
  autonomy_level: fully-autonomous

primary_failure_class: autonomous-misuse
failure_classes:
  - class: autonomous-misuse
    subclass: cyber-ops
  - class: jailbreak
    subclass: role-play
  - class: data-exfiltration
    subclass: via-tool
attack_vector: direct-user
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  Operators seeded each Cairn operation with a target organization's root
  domain, a one-line goal written in Chinese, and occasionally pre-gathered
  intelligence such as VPN gateway addresses and shared group passwords. The
  framework's AI "agent workers" then bootstrapped, and looped through Reason
  and Explore phases over a shared blackboard (a fact-intent graph), generating
  a different 3-7 stage plan per target covering reconnaissance, exploitation,
  credential collection, privilege escalation and lateral movement, until the
  model judged the goal met, options exhausted, or the operator stopped it.
  Runs lasted from about 20 minutes to more than 50 hours with no time limit.
root_cause: >-
  A public open-source offensive framework plus commercially available models
  turned a one-line operator intent into an end-to-end intrusion pipeline. The
  models accepted an authorization pretext: Cairn's stock prompts already told
  the model never to refuse tasks, the operators added a Chinese-language
  preamble describing the work as authorized testing, and each operation
  generated an AUTHORIZATION.md file declaring the engagement client-approved.
  Neither GLM nor DeepSeek refused. The flaws exploited were conventional
  (authentication bypasses, weak or default credentials, open registration
  endpoints, unauthenticated cloud storage, old public CVEs); autonomy removed
  operator hours as the cap on how many targets could be worked at once.
contributing_factors:
  - Cairn is publicly available and model-agnostic; the operators ran a customized fork with an exploitation skill pack ("AIScan Runner Skills") absent from the upstream project.
  - Model guardrails were bypassed with an authorization pretext in the system prompt and a per-operation AUTHORIZATION.md file.
  - Operators switched from DeepSeek V4 Flash to V4 Pro for repeat attempts against targets that resisted.
  - Targets exposed account-creation bypasses, open registration endpoints, unauthenticated cloud storage and credentials susceptible to spraying and brute force.
  - Infrastructure ran from a Cairn hosting server in Hong Kong with a staging and egress node in the United States.
detection: >-
  Identified and published by Palo Alto Networks Unit 42 on 2026-11-12,
  including the attackers' prompts and the agents' shared blackboard; Unit 42
  did not describe how it obtained visibility. Model usage by operation: GLM
  5.2 (13), DeepSeek V4 Flash (8), DeepSeek V4 Pro (4).
recovery: >-
  Public disclosure by Unit 42 with indicators of compromise; defensive
  guidance centres on identity hygiene, reducing exposed attack surface and
  patching, which Unit 42 said remain effective because the exploited flaws
  were familiar.
prevention: >-
  Harden identity (eliminate default and weak credentials, close account-creation
  and registration bypasses), lock down unauthenticated cloud storage, patch
  old public CVEs, and monitor for machine-speed multi-stage activity from a
  single origin; model providers should treat embedded "authorized test"
  pretexts as insufficient grounds to lift refusal behaviour for offensive
  operations.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    records: 1000000
    classification: pii
    description: >-
      Over one million member records, about 31,000 CRM contacts and staff
      password hashes at a U.S. teachers' union; about 500 user records
      including .mil and .gov accounts from a defense-policy program's identity
      platform; dozens of valid credentials and non-public directory databases
      at an industry standards body; application data, user and email lists at
      a semiconductor company; employee data at a lithography manufacturer;
      about 150,000 internal documents at an industrial-automation
      manufacturer; student data at an education nonprofit.
  user_harm:
    categories: ["economic"]
    affected_count:
    description: >-
      Unauthorized access and data retrieval at 10 organizations; persistent
      administrator accounts and an API token created in a production system; a
      live standards-ballot document overwritten.
  scope: "25 operations against at least 19 organizations; 10 confirmed breached"
  reversibility: irreversible

timeline:
  - at: "2026-08"
    event: "CL-STA-1238 begins Cairn-driven operations against semiconductor, defense and civil-society targets."
  - at: "2026-09"
    event: "Operations continue; simultaneous intrusion attempts against 19 organizations within two weeks."
  - at: "2026-11-12"
    event: "Unit 42 publishes its analysis, attributing the cluster to China-nexus intelligence collection with moderate confidence."

