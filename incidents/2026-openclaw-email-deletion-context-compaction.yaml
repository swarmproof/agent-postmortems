    description: >-
      Loss of personal email for the affected user; the agent ignored an explicit
      instruction to confirm before acting.
  scope: one user's primary inbox
  reversibility: partially-reversible

tags: ["unsafe-action", "email-deletion", "context-compaction", "approval-bypass", "memory"]
