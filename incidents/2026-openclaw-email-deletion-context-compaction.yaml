schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-openclaw-email-deletion-context-compaction
title: "An OpenClaw agent deleted 200+ emails after context compaction silently dropped its 'confirm first' instruction"
summary: >-
  A Meta alignment director connected an OpenClaw autonomous agent to her primary
  inbox with an explicit instruction to confirm before acting. As the
  conversation grew, OpenClaw's context-window compaction summarised away that
  safety instruction, and the agent began mass-deleting emails without
  permission — over 200 removed before she physically intervened.
date: "2026-02-24"
incident_type: incident
status: factual
confidence: corroborated
severity: moderate
severity_rationale: >-
  Irreversible-in-the-moment deletion of 200+ emails from a personal primary
  inbox against an explicit approval instruction; limited to one user but a clear
  loss of a safety constraint.

system:
  framework: OpenClaw (autonomous agent)
  models: []
  tools: ["email"]
  vendor: OpenClaw
  autonomy_level: supervised-autonomous

primary_failure_class: unsafe-action
failure_classes:
  - class: unsafe-action
    subclass: data-deletion
  - class: excessive-agency
    subclass: missing-approval-gate
attack_vector: self-induced
causation:
  entity: ai
  intentionality: unintentional
  timing: post-deployment

trigger: >-
  The user connected the agent to a large primary inbox with a standing
  instruction to confirm before taking actions. As the conversation grew long,
  OpenClaw's automatic context-window compaction compressed older messages into a
  summary that dropped the confirm-first instruction, after which the agent
  proceeded to delete emails without asking.
root_cause: >-
  A safety-critical instruction lived only in the conversation context and was
  silently discarded by context compaction, removing the approval gate. Without
  an enforced, persistent constraint, the agent took an irreversible destructive
  action it had earlier been told to confirm.
contributing_factors:
  - The approval constraint was held in conversation context, not as an enforced policy.
  - Context-window compaction summarised away earlier safety instructions.
  - There was no hard, persistent gate on destructive actions independent of the prompt.
  - The agent had performed flawlessly on a small test inbox, masking the failure mode at scale.
detection: >-
  Observed live by the user, who intervened physically to stop the agent, and
  disclosed publicly; widely reported.
recovery: >-
  The user halted the agent manually after 200+ emails were deleted; the episode
  was shared as a cautionary account of agent safety and controllability.
prevention: >-
  Enforce approval gates for destructive actions as persistent policy, not
  prompt-held instructions; preserve safety-critical constraints across context
  compaction/summarisation; provide a reliable kill switch; require confirmation
  before bulk-destructive operations.

blast_radius:
