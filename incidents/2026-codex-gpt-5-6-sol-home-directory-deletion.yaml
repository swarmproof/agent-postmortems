schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-codex-gpt-5-6-sol-home-directory-deletion
title: "Codex sub-agent running GPT-5.6 Sol in Ultra mode misexpanded $HOME and deleted most of a user's Mac home directory"
summary: >-
  While testing OpenAI Codex's high-autonomy Ultra mode with GPT-5.6 Sol in
  Full Access, HyperWrite founder Matt Shumer reported that a cleanup sub-agent
  expanded the $HOME variable incorrectly and ran a recursive delete against his
  Mac home directory. He stopped the process mid-run after material deletion.
  OpenAI's Codex engineering lead later confirmed a pattern in which the model
  overrides $HOME to set a temporary directory and then deletes $HOME instead.
date: "2026-07-10"
incident_type: incident
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  Irreversible deletion of most of a user's home directory; OpenAI confirmed
  the same mechanism across a handful of reports and announced harness
  safeguards, and a second user reported a production database wiped by the
  same model days later.

system:
  framework: OpenAI Codex (Ultra mode, multi-agent, Full Access)
  models: ["gpt-5.6-sol"]
  tools: ["shell", "filesystem"]
  vendor: OpenAI
  autonomy_level: fully-autonomous

primary_failure_class: unsafe-action
failure_classes:
  - class: unsafe-action
    subclass: data-deletion
  - class: tool-misuse
    subclass: unvalidated-args
  - class: excessive-agency
    subclass: missing-approval-gate
attack_vector: self-induced
causation:
  entity: ai
  intentionality: unintentional
  timing: post-deployment

trigger: >-
  During an Ultra-mode session run at OpenAI's
  invitation, a sub-agent assigned a cleanup task attempted to redefine the
  $HOME environment variable to point at a temporary directory. The variable
  was expanded incorrectly and the sub-agent ran a recursive forced delete
  against the user's real home directory path.
root_cause: >-
  The model used an environment-variable override as a way to stage a
  temporary directory, then issued a recursive delete whose target resolved to
  the real home directory. The session ran in Full Access mode with sandboxing
  and auto-review disabled, so no harness check validated the delete path or
  required approval before an irreversible command. OpenAI's Codex lead
  described the most common pattern as Full Access without a sandbox, followed
  by the $HOME override and mistaken deletion of $HOME.
contributing_factors:
  - Full Access mode removed sandboxing and auto-review protections.
  - Ultra mode delegates to sub-agents that run shell commands without a per-command human gate.
  - OpenAI's GPT-5.6 system card, published at launch, noted that Sol takes more unanticipated high-severity actions than GPT-5.5, including deleting data without approval.
  - The user reported many hundreds of prior sessions without issue, which lowered expectations of destructive behaviour.
detection: >-
  The user observed the deletion in progress and killed the process. He
  described the event publicly on X the same day; the post was widely
  reported, and OpenAI engineers contacted him afterwards.
recovery: >-
  The process was stopped mid-run, but most files in the home directory had
  already been removed; no recovery of the deleted files was reported. OpenAI
  said it was updating the developer message, guiding users toward safer
  permission modes, and adding harness safeguards.
prevention: >-
  Run autonomous coding sessions inside an isolated container or virtual
  machine rather than against a personal home directory; keep sandboxing and
  auto-review enabled; require approval or a path allow-list for recursive
  deletes; validate resolved paths before destructive commands; avoid
  overriding environment variables such as $HOME as a staging mechanism.

