    classification: internal
    description: >-
      Most files in one user's Mac home directory were deleted before the
      process was stopped; the exact count and recovery status were not
      published.
  user_harm:
    categories: ["property"]
    affected_count: 1
    description: >-
      Loss of personal and work files for the affected user. Other users
      reported related deletions by the same model, including a production
      database wiped by a cleanup step pointed at a production connection
      string.
  scope: single user's Mac home directory; related reports from a handful of other users
  reversibility: irreversible

