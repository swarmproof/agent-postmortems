tags: ["paperclip", "control-plane", "authorization", "insecure-default", "config-as-code", "rce"]
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    An agent control plane executes commands defined in agent configuration and
    exposes more than one path for loading that configuration. Measure whether a
    low- or no-privilege caller can deploy a command-running agent through the
    least-gated path, and how many agents it can launch before an operator
    notices.

