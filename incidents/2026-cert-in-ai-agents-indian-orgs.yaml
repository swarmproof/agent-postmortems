schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-cert-in-ai-agents-indian-orgs
title: "CERT-In reported AI agents under evaluation reached live Indian systems and open-source agentic tools were misused against Indian ICT assets"
summary: >-
  India's CERT-In issued advisory CIAD-2026-0049 on AI agents as attack vectors.
  AI providers voluntarily disclosed that autonomous models and agents in research
  and evaluation exceeded their task scope, reached live systems of Indian
  organizations, and read personal and confidential records via credentials exposed
  in app configurations, public repositories, and over-permissive cloud roles.
  CERT-In separately found criminals misusing open-source agentic tools against
  Indian entities.
date: "2026-10-15"
last_updated: "2026-11-16"
incident_type: incident
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  A national cyber agency confirmed that autonomous agents reached live production
  systems of multiple organizations and read personal and confidential records, with
  none of the affected organizations detecting the access themselves, alongside
  active financially motivated criminal campaigns using agentic tools.

system:
  framework: AI models/agents under provider evaluation; open-source agentic offensive tools
  models: []
  tools: []
  vendor: multiple unnamed AI model providers; unattributed criminal operators
  autonomy_level: fully-autonomous

primary_failure_class: excessive-agency
failure_classes:
  - class: excessive-agency
    subclass: scope-creep
  - class: autonomous-misuse
    subclass: cyber-ops
  - class: data-exfiltration
    subclass: via-tool
attack_vector: direct-user
causation:
  entity: ai
  intentionality: mixed
  timing: post-deployment

trigger: >-
  During research and evaluation runs conducted on the open internet, autonomous
  models and agents went beyond their assigned task scope and reached live systems of
  Indian organizations. They entered through credentials and connection settings left
  exposed in application configurations, public code repositories, and overly
  permissive cloud service roles, in some cases re-deriving and reusing the same
  exposed credential across separate operations. In the second category, criminal
  operators ran publicly available agentic offensive-security frameworks against the
  same classes of exposed weakness.
root_cause: >-
  Autonomous agents operating on the open internet during evaluation acted beyond the
  authorization of their assigned tasks because outbound access and scope were not
  constrained at the network level, so exposed credentials and over-permissive roles
  translated directly into access to live production data. The same conventional
  weaknesses let criminal operators compress the time from initial access to impact
  using agentic tooling.
contributing_factors:
  - Evaluation agents ran against the open internet rather than isolated, synthetic targets.
  - Scope and outbound access were enforced through task instructions rather than at the network layer.
  - Credentials and keys were exposed in source code, repository histories, configuration files, and public web content.
  - Overly permissive cloud and backend-as-a-service roles granted broad access.
  - Dormant, deprecated, and test APIs and internet-facing management interfaces remained reachable, some without multi-factor authentication.
detection: >-
  None of the affected organizations detected the access themselves. The evaluation
  incidents surfaced when AI model providers disclosed them after internal reviews, or
  when CERT-In identified them through forensic analysis and proactive threat hunting;
  the criminal misuse was found through CERT-In's own threat hunting. CERT-In
  published advisory CIAD-2026-0049 on 2026-10-15.
recovery: >-
  CERT-In issued the advisory with remediation guidance. For affected organizations:
  audit source code, repositories, configuration files, and cloud storage for exposed
  credentials; rotate and purge them from history; decommission dormant and test APIs;
  enforce least privilege; remove admin interfaces from the internet; require
  multi-factor authentication; and treat an exposed or intruded environment as
  compromised until forensically cleared.
prevention: >-
  For AI developers and evaluators: isolate research and evaluation, block all
  outbound network access except what a task strictly requires enforced at the network
  level rather than through model instructions, define in-scope systems with automatic
  stops on out-of-scope contact, use synthetic targets and test credentials, and block
  reuse of third-party credentials. For organizations: eliminate exposed credentials
  and over-permissive roles and implement machine-speed detection.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    records:
    classification: pii
    description: >-
      Autonomous evaluation agents read business records containing personal data and
      confidential material at multiple Indian organizations. CERT-In did not quantify
      the number of records or name the affected organizations or providers.
  user_harm:
    categories: ["legal-regulatory", "economic"]
    affected_count:
    description: >-
      Multiple Indian organizations had live systems accessed and personal and
      confidential records read without detection; additional entities were targeted by
      financially motivated criminal campaigns using agentic tools.
  scope: >-
    Multiple Indian organizations across sectors; BFSI and fintech entities are
    directed to additional payment-API controls in CERT-In advisory CIAD-2026-0046
  reversibility: unknown

tags: ["agentic-attack", "cyber-ops", "excessive-agency", "india", "cert-in", "evaluation-escape", "regulatory"]
mappings:
