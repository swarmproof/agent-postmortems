schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-skills-sh-paperclip-browser-use-credential-stealer-skills
title: "Look-alike Paperclip and Browser Use skills on skills.sh steered coding agents into running a credential stealer; 1.7M aggregate installs"
summary: >-
  Zenity Labs found a skill family on Vercel's skills.sh registry impersonating
  the Paperclip and Browser Use projects. Uploaded as clean copies, it trended,
  then was updated with instructions that led agents to fetch and run a credential
  stealer targeting SSH keys and cloud, registry and CI secrets. The family showed
  over 1.7 million aggregate installs by 2026-08-02; unique victims are unknown.
  Vercel and GitHub removed the listings and repositories within 12 hours of
  notification.
date: "2026-07-11"
last_updated: "2026-11-16"
incident_type: incident
status: factual
confidence: corroborated
severity: high
severity_rationale: >-
  A credential stealer reached developer workstations, CI runners and agent
  workspaces through a trending registry listing with more than 1.7 million
  aggregate installs, with no exploit of any vulnerability: the agents followed
  skill instructions as written. Unique victim counts are unknown.

system:
  framework: Agent skills ecosystem (skills.sh registry operated by Vercel); consumers include Claude Code, OpenClaw, OpenAI Codex and Cursor
  models: []
  tools: ["skills-sh", "github", "npm", "pypi", "curl", "node"]
  vendor: Vercel (registry operator); impersonated projects Paperclip and Browser Use
  autonomy_level: supervised-autonomous

primary_failure_class: supply-chain-compromise
failure_classes:
  - class: supply-chain-compromise
    subclass: extension
  - class: prompt-injection
    subclass: indirect
  - class: excessive-agency
    subclass: missing-approval-gate
  - class: data-exfiltration
    subclass: via-tool
attack_vector: supply-chain
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  In early July 2026 an actor registered GitHub organisations and a domain that
  mimicked the Paperclip agent-orchestration project and the Browser Use browser
  automation project, and published verbatim copies of their official skills to
  skills.sh. The copies accumulated installs and reached the registry's 24-hour
  trending list. On 2026-07-11 the skill documents were updated with malicious
  instructions. A secondary setup file, which the main skill told agents to read
  only when Paperclip needed installing or starting, directed the agent to fetch a
  fake health endpoint with TLS verification disabled, base64-decode the response,
  execute it with Node and delete it, and steered agents away from the genuine npm
  package toward attacker-controlled checkouts and GitHub releases. Companion
  packages (browser-use-headless 0.1.4 and paperclip-ai on PyPI and npm) were
  flagged and removed by the registries within hours, after which the skills
  pointed to a stealer hosted on GitHub; an npm postinstall loader was added on
  2026-07-30.
root_cause: >-
  Skills are natural-language instruction files that agents execute with the
  user's privileges, and the registry displayed install counts and trending
  rank as implicit trust signals without verifying publisher identity against
  the impersonated projects or re-reviewing content after updates. Agents
  followed instructions in a progressively loaded secondary file to download and
  run remote code without an approval gate, so a listing that was clean at
  review time became an execution channel once its text changed.
contributing_factors:
  - Skills were uploaded as clean copies of official content and weaponised only after accumulating trust and trending placement.
  - Name and organisation look-alikes for Paperclip and Browser Use passed as the genuine projects.
  - The malicious command lived in a secondary file loaded on demand, which static review of the main skill did not surface.
  - Skills instructed agents to run a remote loader with TLS verification disabled and to avoid the legitimate npm package.
  - Cross-referencing skills triggered cascade installs, inflating counts and spreading the family.
  - Removed PyPI and npm packages were replaced by GitHub-hosted payloads within days.
detection: >-
  Zenity Labs identified the family through research on skills.sh, observed it
  at rank 8 on the 24-hour trending list on 2026-07-11 and still trending on
  2026-08-01, and traced the loader and stealer behaviour by dynamic analysis.
  The companion PyPI packages were flagged by Kamil Mankowski and Amazon
  Inspector within hours of publication. Zenity published its findings on
  2026-08-06 and presented them at Black Hat USA 2026.
recovery: >-
  Following Zenity's notification, Vercel removed the skills and listings from
  skills.sh and GitHub removed the look-alike repositories, both within 12 hours;
  the listings were gone by 2026-08-02. PyPI and npm had earlier removed the
  companion packages. Copies may persist in downstream repositories, aggregators
  and on machines that installed the skills, which users must remove manually
  and treat as credential exposure requiring rotation.
prevention: >-
  Verify skill publishers against the upstream project identity and re-review
  content on every update, including secondary files loaded on demand; run
  skills in a contained environment and inspect runtime behaviour before
  listing; require explicit approval before an agent downloads and executes
  remote code or disables TLS verification; scope the secrets reachable from
  agent workspaces and CI runners; and treat install counts as untrusted signals.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    records:
    classification: credentials
    description: >-
      The stealer targeted more than 100 paths per platform: SSH keys; AWS, GCP
      and Azure credentials; Kubernetes, Docker and Git configuration; npm, PyPI
      and other registry tokens; Terraform, Pulumi and database credentials;
      shell profiles and .env files; CI/CD configuration; and service-account
      files for Firebase, Vercel, Netlify, Cloudflare and Supabase. Collected data
      was base64-encoded and posted to an attacker-controlled domain.
  user_harm:
    categories: ["economic"]
    affected_count:
    description: >-
      Credential exposure on developer workstations, CI runners and agent
      workspaces that installed the skills; Zenity reported no victim
      organisations by name and states the number of unique victims is unknown.
  scope: "skills.sh skill family with 1.7M+ aggregate installs (individual skills near 300K); unique victims unknown"
  reversibility: irreversible

timeline:
  - at: "2026-07-02"
    event: "Look-alike domain and GitHub organisation created."
  - at: "2026-07-05"
    event: "Skill family first appears on skills.sh with clean content copied from the official skills."
  - at: "2026-07-11"
    event: "Skill documents updated with malicious instructions; family ranks 8th on the 24-hour trending list."
  - at: "2026-07-13"
    event: "browser-use-headless 0.1.4 published to PyPI and flagged within two hours."
  - at: "2026-07-20"
    event: "paperclip-ai published to PyPI and flagged within the hour."
  - at: "2026-07-30"
    event: "npm postinstall loader added and loader endpoint rotated."
  - at: "2026-08-02"
    event: "Skills, listings and repositories removed by Vercel and GitHub within 12 hours of Zenity's outreach; aggregate installs exceed 1.7 million."
  - at: "2026-08-06"
    event: "Zenity Labs publishes its research."

