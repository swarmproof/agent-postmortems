schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2025-claude-code-dns-exfiltration
title: "Claude Code could be prompt-injected into leaking secrets over DNS via allowlisted commands (CVE-2025-55284)"
summary: >-
  In Claude Code before v1.0.4, an injection planted in a file the tool analyzed
  could make it abuse network commands that were on the no-approval allowlist
  (ping, nslookup, host, dig) to encode secrets from .env or /proc/PID/environ
  into DNS queries and exfiltrate them to an attacker-controlled server
  (CVE-2025-55284).
date: "2025-06-06"
incident_type: hazard
status: final
confidence: confirmed
severity: high
severity_rationale: >-
  Exfiltration of local secrets (API keys, environment variables) via
  allowlisted commands that bypassed user approval (CVE-2025-55284, CVSS 7.1).
  Patched in v1.0.4; no confirmed in-the-wild exploitation.

system:
  framework: Claude Code (CLI)
  models: []
  tools: ["bash", "dns", "filesystem"]
  vendor: Anthropic
  autonomy_level: supervised-autonomous

primary_failure_class: prompt-injection
failure_classes:
  - class: prompt-injection
    subclass: indirect
  - class: data-exfiltration
    subclass: via-tool
attack_vector: untrusted-content
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  Text in a file that Claude Code analyzed contained injected instructions.
  Because ping, nslookup, host, and dig were on the allowlist of commands that
  ran without user approval, the injection could read data from a .env file (or
  /proc/PID/environ), encode it into a hostname, and issue a command such as a
  ping — generating a DNS lookup that leaked the data to an external server.
root_cause: >-
  Network diagnostic commands were allowlisted to run without approval, and the
  agent acted on instructions from untrusted file content. Allowlisted commands
  that can trigger outbound DNS became a covert exfiltration channel that
  bypassed the normal Bash-tool authorization flow.
contributing_factors:
  - Commands capable of outbound network activity (ping/nslookup/host/dig) were on the no-approval allowlist.
  - The agent treated instructions in analyzed file content as actionable.
  - Local secrets (.env, /proc/PID/environ) were reachable by the agent's tools.
detection: >-
  Discovered and disclosed by researcher Johann Rehberger (wunderwuzzi); reported
  to Anthropic on 2025-05-26.
recovery: >-
  Anthropic fixed the issue in Claude Code v1.0.4, released 2025-06-06; users
  were advised to upgrade.
prevention: >-
  Keep commands that can cause outbound network requests off no-approval
  allowlists; treat file/tool content as untrusted; restrict egress and DNS from
  agent tool sandboxes; scope access to secrets; require approval for actions
  that can transmit data externally.

blast_radius:
  data:
    classification: credentials
    description: >-
      API keys and environment variables (via .env files and /proc/PID/environ)
      could be encoded into DNS queries and exfiltrated to an attacker-controlled
      server.
  user_harm:
    categories: ["none-reported"]
    description: >-
      A disclosed vulnerability with a released fix; no confirmed in-the-wild
      exploitation was reported.
  scope: Claude Code CLI users before v1.0.4
  reversibility: reversible

cve: ["CVE-2025-55284"]
cwe: ["CWE-200"]
tags: ["prompt-injection", "data-exfiltration", "dns", "claude-code", "allowlist", "cve"]
related_incidents:
