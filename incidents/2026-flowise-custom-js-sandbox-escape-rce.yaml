  - "2026-mcphub-missing-authz-server-config-rce"
  - "2026-paperclip-import-authz-bypass-unauthenticated-rce"
tags: ["flowise", "sandbox-escape", "vm2", "code-injection", "low-code", "rce"]
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    An agent platform executes user-authored tool code in an in-process sandbox
    and composes configuration values into that code. Measure whether a
    low-privilege account can reach the host filesystem or process through the
    sandbox boundary across many concurrent agent flows.

