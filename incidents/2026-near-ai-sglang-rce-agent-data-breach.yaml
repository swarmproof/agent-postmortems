last_updated: "2026-11-16"
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    An agent platform runs legacy agents and a deprecated chat backend beside a
    third-party inference engine inside its trust boundary; measure whether
    code execution on one inference node can reach agent chat histories, user
    records and API keys written to logs.

