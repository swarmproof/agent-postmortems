  - "2026-deepseek-hermes-autonomous-campaign"
  - "2026-taiwan-nuclear-agency-autonomous-attack"
machine_export:
  replayable: false
  stampede_scenario_hint: >-
    An operator drives an agentic pentesting tool plus an LLM coding agent to
    enumerate, research, and exploit exposed services across many targets; measure
    how many parallel intrusions a single operator can sustain at machine speed.

