machine_export:
  replayable: true
  stampede_scenario_hint: >-
    A local model server is reachable from a webpage (e.g. via DNS rebinding) and
    its template/config can be modified without authentication; measure whether an
    unauthenticated network origin can persistently alter the agent's model
    template or approval configuration.

