incident_id: 2026-plugin4shell-coding-agent-plugin-pin-bypass
title: "Plugin4Shell: coding agents' plugin hash pinning could be bypassed by a repository branch named after the pinned commit (CVE-2026-86063)"
summary: >-
  Air Security showed that Claude Code, OpenAI Codex, GitHub Copilot and Gemini
  CLI checked out pinned plugin commits without verifying the resulting commit
  matched the pin. A plugin repository owner could name a branch after the pinned
  hash so the checkout resolved to attacker-chosen code, and background
  auto-update delivered it to installed plugins. Anthropic, OpenAI and Microsoft
  shipped fixes; Google said the deprecated Gemini CLI would not be fixed.
date: "2026-09-17"
last_updated: "2026-11-16"
incident_type: hazard
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  Zero-click code execution on developer machines via the plugin update path of
  four widely installed coding agents, confirmed by a vendor CVE (CVE-2026-86063,
  rated high). Researcher demonstration under coordinated disclosure; no
  in-the-wild exploitation reported. One affected product remains unfixed because
  it is deprecated.

system:
  framework: "Plugin subsystems of Claude Code, OpenAI Codex, GitHub Copilot (VS Code), Gemini CLI"
  models: []
  tools: ["git", "plugin-marketplace", "auto-update"]
  vendor: "Multiple (Anthropic, OpenAI, Microsoft/GitHub, Google)"
  autonomy_level: supervised-autonomous

primary_failure_class: supply-chain-compromise
failure_classes:
  - class: supply-chain-compromise
    subclass: extension
  - class: excessive-agency
    subclass: missing-approval-gate
attack_vector: supply-chain
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  A marketplace pins a reviewed plugin to a specific commit hash. An attacker who
  controls the plugin's source repository creates a branch whose name is that
  hash and makes it the default. When the agent fetches and checks out the pin,
  git resolves the ambiguous name to the branch rather than the commit, so the
  agent installs attacker-chosen code. Because the same checkout runs again
  during background auto-update, which is on by default in Claude Code and
  Codex, a re-pin pushes the substituted code to already-installed plugins with
  no user action. A Gemini CLI variant discarded the correctly fetched commit by
  checking out a name that could also resolve to a branch. Hosts that accept
  hash-shaped branch names, such as Bitbucket and self-hosted git, are exposed;
  the researchers report GitHub rejects such names.
root_cause: >-
  The agents treated a pinned commit hash as a guarantee of content but never
  verified that the commit actually checked out equalled the pin. Trust was
  placed in a git name-resolution step that prefers branches over commits when a
  name is ambiguous, and the auto-update path re-ran that step unattended, so a
  single repository-side change could replace reviewed plugin code across all
  installs without a marketplace compromise or a user prompt.
contributing_factors:
  - Plugin installation and update checked out a pinned reference without comparing the resulting commit to the pinned hash.
  - Background auto-update was enabled by default, re-running the vulnerable checkout without user involvement.
  - The plugin trust model assumed the marketplace pin, not the plugin repository owner, controlled what code ran.
  - Several git hosting services permit branch names that look like commit hashes.
detection: >-
  Found by Air Security's research lab in May 2026 with a working proof of
  concept against all four agents (researchers Or Nevo, Dor Granat and Niv
  Hoffman), disclosed to the vendors in June 2026 and published on 2026-09-17.
  Independent coverage followed from SecurityWeek and The Hacker News.
recovery: >-
  Anthropic confirmed a fix in Claude Code 2.1.179 on 2026-06-17 and later
  published CVE-2026-86063 (GitHub advisory GHSA-pq7j-f95f-qfcv, affected
  versions below 2.1.179). OpenAI's fix was verified in Codex 0.146.0 on
  2026-08-12. Microsoft confirmed a fix in VS Code 1.136.0 on 2026-09-02. Google
  stated on 2026-08-04 that no fix would ship because Gemini CLI is deprecated,
  and advised migration to Antigravity.
prevention: >-
  Verify after checkout that the resolved commit equals the pinned hash and fail
  closed on mismatch; resolve pins by commit object rather than by name; treat
  plugin auto-update as a security-relevant action that re-validates integrity;
  for operators, pin plugins through a marketplace or filter that validates
  content independently of the source repository, and disable background plugin
  updates where that validation is absent.

