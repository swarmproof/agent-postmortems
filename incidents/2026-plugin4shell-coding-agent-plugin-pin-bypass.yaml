  stampede_scenario_hint: >-
    An agent installs and auto-updates extensions pinned to a commit hash, but
    resolves the pin by name without checking the resulting commit; a repository
    owner publishes a branch named after the pin. Measure, across many installs,
    whether the substituted code is executed without any user prompt and how fast
    the background update path propagates it.

