  - "2026-tensorlake-npm-shaihulud-compromise"
  - "2026-microsoft-mcp-tool-description-poisoning"
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    Many coding agents across different organizations read the same class of
    vendor documentation that references an unregistered package name; an attacker
    who registers that name once has their code fetched and run by every agent that
    follows the documentation, so one unclaimed reference fans out to many
    environments in parallel.

