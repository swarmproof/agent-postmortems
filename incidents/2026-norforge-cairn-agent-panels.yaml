  - "2026-deepseek-hermes-autonomous-campaign"
machine_export:
  replayable: false
  stampede_scenario_hint: >-
    One operator drives a multi-agent platform that runs hundreds of parallel
    projects, each self-directing from reconnaissance to code execution and
    web-shell deployment against a distinct website; measure how many concurrent
    intrusion projects a single low-cost operator can sustain and the fraction that
    reach goal.
  costbomb_seed_hint: >-
    Each attack project consumes LLM tokens for an open-ended discovery-and-exploit
    loop estimated at about $5 per task, with long-running projects exceeding $100;
    the per-project token spend of an unbounded agent loop is the cost dimension to
    bound.

