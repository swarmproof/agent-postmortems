schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-wiz-red-agent-snowflake-cicd-jira-access
title: "Wiz's autonomous red-team agent exploited a GitHub Actions injection in a Snowflake repository and read internal Jira"
summary: >-
  As authorized research through Snowflake's HackerOne program, Wiz's autonomous
  agent found and exploited a shell-injection flaw in a GitHub Actions workflow in
  the public snowflake-connector-net repository. A crafted issue title ran commands
  on the runner and exfiltrated a Jira token that read internal engineering,
  compliance and bug-bounty projects. The vulnerable change had passed a Copilot
  review marked all-clear. The agent adapted its payload after a first failure.
date: "2026-08-17"
last_updated: "2026-11-16"
incident_type: hazard
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  An autonomous agent chained discovery, payload adaptation and exploitation of a
  CI injection into code execution on a runner and read access to an internal
  issue tracker, through an unauthenticated public entry point, in authorized
  research with accessed data deleted and no third-party exploitation found.

system:
  framework: Wiz Red Agent (autonomous security-research agent); GitHub Actions; GitHub Copilot code review
  models: []
  tools: ["github-actions", "ci", "jira", "wiz-red-agent"]
  vendor: Wiz (research); Snowflake (affected repository operator)
  autonomy_level: fully-autonomous

primary_failure_class: autonomous-misuse
failure_classes:
  - class: autonomous-misuse
    subclass: cyber-ops
  - class: task-failure
    subclass: quality-degradation
  - class: insecure-output
    subclass: injection-vuln
attack_vector: n-a
causation:
  entity: ai
  intentionality: intentional
  timing: post-deployment

trigger: >-
  Wiz's Red Agent, scanning Snowflake's GitHub organisation, identified a script
  injection in the jira_issue.yml workflow of the public snowflake-connector-net
  repository. The workflow ran on the issues-opened event and interpolated the
  issue title directly into a shell command, and its guard against untrusted users
  was written for pull requests, so it did not apply to issues. The flaw went live
  on 2026-06-18 when a pull request replaced a safer input-handling pattern with
  direct interpolation. The agent opened an issue with a crafted title; its first
  payload failed on a shell syntax error, after which it adjusted the payload on
  its own and obtained an out-of-band callback carrying a base64-encoded Jira API
  token, which it used to authenticate to Snowflake's internal Atlassian instance.
root_cause: >-
  A GitHub Actions workflow treated untrusted issue text as trusted shell input
  with an ineffective access guard, and an AI code review of the introducing change
  reported it all-clear and did not flag the injection. An autonomous agent could
  then discover the flaw, adapt a failed payload and reach a long-lived service
  token from an unauthenticated public entry point, with the token scoped to broad
  internal project read access.
contributing_factors:
  - The workflow interpolated the issue title directly into a shell command.
  - The untrusted-user guard was written for pull-request events and did not apply to issue events.
  - A GitHub Copilot review of the introducing pull request reported it all-clear and missed the injection.
  - The exfiltrated Jira token authenticated as a service account with broad read access across internal projects.
  - The agent autonomously adapted its payload after an initial failure, with no human in the loop.
detection: >-
  Wiz reported the vulnerability to Snowflake through its HackerOne program on
  2026-06-23. Snowflake's audit found the only access during the window matched
  Wiz's testing addresses and no other party accessed the endpoint. Wiz published
  its research on 2026-08-17.
recovery: >-
  Snowflake restored a safer input-handling pattern in the workflow on 2026-06-23
  and rotated the affected Jira token on 2026-06-24. Wiz confirmed that all data
  accessed during proof-of-concept testing was securely deleted.
prevention: >-
  Pass untrusted issue and pull-request fields through environment variables and
  avoid interpolating them into shell commands; apply access guards that cover
  every triggering event type; do not rely on an AI code review as the sole check
  for CI-configuration security; scope CI service tokens narrowly and make them
  short-lived; and monitor workflow runners for anomalous outbound connections.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    records:
    classification: credentials
    description: >-
      Exploitation achieved code execution on the Actions runner and exfiltrated a
      Jira API token that authenticated as an internal service account with read
      access to engineering, security-compliance and bug-bounty tracking projects.
      Wiz reported deleting all data accessed during testing.
  user_harm:
    categories: ["none-reported"]
    affected_count:
    description: >-
      Authorized research through a disclosure program; Snowflake's investigation
      found no evidence of unauthorized access by any party other than Wiz, and
      accessed data was deleted.
  scope: "snowflake-connector-net GitHub Actions workflow and the internal Jira projects readable with the exfiltrated service-account token"
  reversibility: reversible

timeline:
  - at: "2026-06-18"
    event: "A merged pull request introduces direct interpolation of the issue title into the workflow's shell command; the flaw goes live."
  - at: "2026-06-23"
    event: "Red Agent exploits the flaw about five days after it went live; Wiz reports it via HackerOne and Snowflake patches the workflow the same day."
  - at: "2026-06-24"
    event: "Snowflake rotates the affected Jira token."
  - at: "2026-08-17"
    event: "Wiz publishes its research describing the autonomous end-to-end exploitation."

