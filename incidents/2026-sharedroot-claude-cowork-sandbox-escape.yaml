schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-sharedroot-claude-cowork-sandbox-escape
title: "SharedRoot: Claude Cowork's local agent VM could be escaped to read and write host Mac files, including credentials"
summary: >-
  Accomplish AI disclosed SharedRoot, a chain in which the agent session inside
  Claude Cowork's local Linux VM escalated within the guest and, because the
  host filesystem was mounted into the VM with write access, reached files across
  the host Mac without a permission prompt. Reachable data included SSH keys and
  cloud credentials. Anthropic classed the report informative; Cowork's default
  shifted to cloud execution, which the researcher says the local escape does not
  reach.
date: "2026-07-23"
last_updated: "2026-11-16"
incident_type: hazard
status: factual
confidence: corroborated
severity: high
severity_rationale: >-
  A demonstrated sandbox escape from an agent runtime to arbitrary read and
  write of host files, including credentials, with no user prompt, affecting a
  local-execution mode reportedly used by roughly 500,000 macOS users before the
  default changed. Researcher demonstration; no in-the-wild exploitation
  reported, and the local mode remained available at disclosure.

system:
  framework: "Claude Cowork (local VM execution mode)"
  models: []
  tools: ["local-vm", "host-filesystem-mount"]
  vendor: Anthropic
  autonomy_level: supervised-autonomous

primary_failure_class: excessive-agency
failure_classes:
  - class: excessive-agency
    subclass: scope-creep
  - class: unsafe-action
    subclass: cross-domain-action
attack_vector: self-induced
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  An agent session running inside Cowork's local Linux VM gained elevated
  privilege within the guest by combining guest configuration that the session
  was permitted to use with a known Linux kernel privilege-escalation bug
  (CVE-2026-46331) that the guest exposed. Because Cowork mounted the host Mac's
  filesystem into the VM with write access, guest-level escalation turned into
  read and write access to files across the host, reaching data well beyond the
  folder the user had connected and without any permission prompt. The researcher
  frames the kernel bug as replaceable and the host-access outcome as the result
  of the surrounding design choices.
root_cause: >-
  The containment boundary did not hold once the in-VM session was elevated,
  because the host filesystem was shared into the guest with write access rather
  than scoped to what the task needed. The guest also permitted the configuration
  and on-demand kernel features that enabled in-guest escalation, so a single
  kernel bug of that class was sufficient to cross from the agent's VM to the
  host. The researcher identifies four independent design choices, any one of
  which would have broken the chain and would also blunt future kernel bugs of
  the same kind.
contributing_factors:
  - The host filesystem was mounted into the agent VM with broad write access rather than a narrow, task-scoped mount.
  - The guest permitted configuration and on-demand kernel features that enabled in-guest privilege escalation.
  - A root-owned helper run by the host-side daemon could be influenced from the escalated guest session.
  - Containment relied on the guest kernel's integrity, so a single kernel bug of this class crossed the boundary.
detection: >-
  Found and published by Oren Yomtov, Principal Security Researcher at Accomplish
  AI, on 2026-07-23. The Cloud Security Alliance published a research note on
  2026-07-24 and The Next Web and The Hacker News covered the disclosure.
recovery: >-
  Anthropic classified the report as informative, citing that the underlying CVE
  fell within the bug-bounty program's recent-publication window and that the
  proposed changes were defense-in-depth rather than a standalone vulnerability,
  per the Cloud Security Alliance note; the researcher reports no fix was issued
  for the local execution mode. Cowork's default now routes agent execution to
  the cloud instead of a local VM, and the researcher states the local escape
  path does not appear to apply to the cloud mode. The underlying kernel bug was
  fixed upstream in Linux v7.1-rc7.
prevention: >-
  Scope any host filesystem shared into an agent VM to the minimum the task needs
  and prefer read-only mounts; disable guest configuration and on-demand kernel
  features that enable in-guest privilege escalation; run host-side helpers so an
  escalated guest cannot influence them; treat containment as defense-in-depth
  with several independent barriers rather than a single kernel boundary.

