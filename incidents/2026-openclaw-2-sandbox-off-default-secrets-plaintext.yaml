tags: ["openclaw", "insecure-default", "sandboxing", "secrets-at-rest", "shared-sessions", "attack-surface"]
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    Many self-hosted agent gateways run tool execution on the host by default
    with plaintext credentials on disk. Measure, across installs, whether a
    single hostile tool output or skill can read stored credentials and act on
    the host when the sandbox is not enabled.

