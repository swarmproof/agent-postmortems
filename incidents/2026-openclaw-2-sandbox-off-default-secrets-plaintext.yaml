schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-openclaw-2-sandbox-off-default-secrets-plaintext
title: "OpenClaw 2.0 shipped with tool sandboxing off by default and Secret Store values unencrypted at rest"
summary: >-
  OpenClaw 2.0 (release 2026.8.1), a self-hosted agent harness, simplified
  setup and added shared cloud sessions while its own release notes state that
  sandboxing is off by default, that Secret Store values are not encrypted at
  rest and depend on filesystem permissions, and that shared-session controls
  are not tenant isolation or a security boundary. Documented as a posture; no
  exploited-in-the-wild case reported.
date: "2026-08-30"
incident_type: hazard
status: factual
confidence: confirmed
severity: moderate
severity_rationale: >-
  No realized harm reported and the controls exist (sandbox backends, tool
  policy denies, separate gateways). Attack surface is notable because the
  default install runs agent tool execution directly on the host with plaintext
  credentials reachable by anything the agent or its tools can read.

system:
  framework: OpenClaw 2.0 (2026.8.1)
  models: []
  tools: ["exec", "secret-store", "cloud-sessions", "sandbox"]
  vendor: OpenClaw Foundation
  autonomy_level: supervised-autonomous

primary_failure_class: excessive-agency
failure_classes:
  - class: excessive-agency
    subclass: scope-creep
  - class: data-exfiltration
    subclass: via-tool
attack_vector: n-a
causation:
  entity: human
  intentionality: unintentional
  timing: post-deployment

trigger: >-
  A default OpenClaw 2.0 install, reached after the simplified first-run setup,
  executes agent tools directly on the host because the sandbox is opt-in.
  Credentials placed in the Secret Store are written unencrypted and protected
  only by the permissions of the state directory, so a misbehaving agent, a
  hostile skill, or any process with filesystem access can read them.
root_cause: >-
  The release prioritised a fast first conversation over secure defaults:
  sandboxing requires explicit per-agent or global configuration, credential
  protection is delegated to filesystem permissions, and the new
  multi-user controls limit collaboration inside one trusted installation
  rather than isolating tenants. The documentation itself notes that text from
  network-backed tools is marked untrusted but can still influence the model,
  which makes unconfined tool execution the limiting control.
contributing_factors:
  - Sandboxing is off by default; enabling it requires per-agent or global configuration.
  - Secret Store values are not encrypted at rest and rely on state-directory permissions.
  - Destination-bound credential substitution covers only Gateway-hosted HTTPS commands that honour proxy settings.
  - Shared cloud sessions are documented as not a security boundary; separate gateways are required for tenant separation.
  - Even when enabled, the sandbox is documented as not a perfect security boundary and excludes the Gateway process.
detection: >-
  Stated in the OpenClaw 2026.8.1 release notes and gateway sandboxing
  documentation published with the 2026-08-30 release, and reported by The
  Register on 2026-08-31 and by independent analysts in the following weeks.
recovery: >-
  Not an in-the-wild incident; no remediation event. OpenClaw documents
  per-agent and global sandbox settings, tool-policy denies for exec, and
  separate gateways per tenant as the available controls.
prevention: >-
  Ship sandboxing on by default with a documented opt-out; encrypt stored
  credentials at rest and bind them to destinations by default; present
  security posture during first-run setup; treat one gateway as one trust
  domain and deploy separate gateways for untrusted users.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    classification: credentials
    description: >-
      Secret Store contents are readable by any process or agent tool with
      access to the state directory. This records the documented posture, not a
      breach.
  user_harm:
    categories: ["none-reported"]
    description: >-
      No realized harm reported; the hazard is the default attack surface.
  scope: "OpenClaw 2.0 installs using default sandbox and secret-store settings"
  reversibility: unknown

timeline:
  - at: "2026-08-30"
    event: "OpenClaw Foundation announces OpenClaw 2.0 (2026.8.1)."
  - at: "2026-08-31"
    event: "The Register reports the release notes' sandbox, secret-store and shared-session caveats."

