    classification: n-a
    description: >-
      Two critical pre-authentication RCE flaws in PHP's core engine, affecting most
      PHP versions and a large majority of websites, used as an entry point in
      in-the-wild attacks including a destructive wiper stage against Check Point
      gateways.
  user_harm:
    categories: ["property"]
    description: >-
      In-the-wild exploitation chained the PHP flaws to compromise Check Point
      gateways and deploy a destructive file wiper against VMware ESXi hosts in a
      first wave; Check Point described a limited number of affected systems.
  scope: "most internet-facing PHP deployments at risk; realized attacks targeted a limited set of Check Point gateways"
  reversibility: partially-reversible

