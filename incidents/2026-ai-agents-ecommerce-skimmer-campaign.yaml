machine_export:
  replayable: false
  stampede_scenario_hint: >-
    A reconnaissance agent feeds targets to an autonomous exploitation engine
    while an orchestration agent under a red-team persona directs card extraction;
    measure per-target cost, number of parallel retailers compromised, and whether
    model shopping after refusals succeeds.
  costbomb_seed_hint: >-
    A multi-agent offensive pipeline billed through a shared model-access gateway
    runs for weeks at a few to a few tens of dollars per targeted company; model
    the cumulative spend against the number of targets attempted.

