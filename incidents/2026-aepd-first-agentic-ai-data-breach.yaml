schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-aepd-first-agentic-ai-data-breach
title: "Spain's data protection authority publicised the first breach notification attributing an attack to an AI agent"
summary: >-
  Spain's data protection authority (AEPD) publicised what it calls the first breach
  notification in which a third party used an AI agent as the instrument of an attack.
  Per the notification, the agent searched for vulnerabilities, completed a login, then
  modified personal data and accessed invoices at a Spanish organisation. The AEPD
  cautioned the account comes from the notifying organisation and is pending analysis,
  and did not disclose the organisation, affected counts, or the model.
date: "2026-09-14"
last_updated: "2026-11-16"
incident_type: incident
status: preliminary
confidence: reported
severity: moderate
severity_rationale: >-
  A reported breach of personal data at one organisation, with personal data modified
  and invoices accessed. Severity is bounded by limited disclosure: affected counts,
  data categories and the organisation are unknown, and the regulator notes the
  account is unverified and pending analysis.

system:
  framework: n/a
  models: []
  tools: []
  vendor: "AEPD (reporting regulator); affected organisation not disclosed"
  autonomy_level: unknown

primary_failure_class: autonomous-misuse
failure_classes:
  - class: autonomous-misuse
    subclass: cyber-ops
attack_vector: n-a
causation:
  entity: both
  intentionality: intentional
  timing: post-deployment

trigger: >-
  According to the notification summarised by the AEPD, a third party directed an AI
  agent built on a well-known language model to chain the phases of an attack against
  an organisation's application: searching for vulnerabilities, completing a login,
  and then reaching personal data and invoices.
root_cause: >-
  The AEPD frames the agent as an instrument that let an attacker chain attack phases
  at speed. The regulator states the use of a particular model does not imply the model
  or its provider's infrastructure was compromised, and that the underlying technical
  vector is not established in the notification.
contributing_factors:
  - The agent chained reconnaissance, authentication and data access as sequential phases.
  - Response procedures scoped to human-paced attackers may be insufficient against an agent acting quickly.
  - Credentials, keys or tokens with broad permissions let an automated agent operate at speed.
detection: >-
  Reported to and publicised by Spain's data protection authority (AEPD) in a blog
  entry on 2026-09-14; covered by Reuters and SecurityWeek. The AEPD states the
  information comes from the affected organisation's own notification.
recovery: >-
  Not disclosed. The AEPD said its investigation is ongoing and that the notification
  must be subject to the corresponding analysis before conclusions are drawn.
prevention: >-
  The AEPD recommends naming AI-assisted and adversarial-agent threats explicitly in
  risk analysis rather than generic categories; reviewing incident-response times
  against fast-acting agents; protecting digital identities, API keys and tokens
  against excessive permissions; and supporting human oversight with automated
  detection, containment and response.

