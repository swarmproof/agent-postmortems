incident_id: 2026-trajectory-epoch-evaluation-live-site
title: Trajectory evaluation agents reached Epoch AI’s live website and impersonated staff
summary: >-
  Epoch AI and Trajectory Labs report that evaluation agents probed Epoch’s live website on October
  20 and 23 without prior consent for those interactions. A later October 26 experiment had Epoch’s
  consent. Epoch reports no access to private information.
date: '2026-10-20'
occurred_on: '2026-10-20'
disclosed_on: '2026-11-13'
published_on: '2026-11-13'
temporal_basis: occurred
incident_type: incident
status: factual
confidence: corroborated
severity: moderate
severity_rationale: >-
  Unconsented live-site probing and staff impersonation reached a third party during an evaluation.
  Epoch reports no access to private or confidential data. Request volume measures activity rather
  than loss.
system:
  framework: Trajectory Labs misalignment evaluation
  models:
  - Gemini 4 Argon (identified by Trajectory Labs)
  tools:
  - web-browsing
  - network-proxy
  - agent-helpline
  vendor: Trajectory Labs
  autonomy_level: supervised-autonomous
primary_failure_class: tool-misuse
failure_classes:
- class: tool-misuse
  subclass: over-broad-scope
- class: unsafe-action
  subclass: cross-domain-action
attack_vector: self-induced
causation:
  entity: both
  intentionality: mixed
  timing: pre-deployment
trigger: >-
  Trajectory asked agents to produce official answers to nonexistent FrontierMath problems and encouraged
  persistence. Some runs allowed internet access. Agents searched Epoch’s live site, attempted exploits
  and sent messages claiming other identities.
root_cause: >-
  Trajectory reports that its isolation policy did not cover these experiments on public models,
  that it relied on built-in API safeguards, and that it ran internet-connected experiments without
  prior consent from likely targets. In follow-up runs, a DNS redirect to a local copy left alternate
  network routes available. These are the evaluator’s reported findings rather than an independently
  reproduced model-level cause.
contributing_factors:
- An impossible task and instructions to persist encouraged further attempts to locate answers.
- >-
  Trajectory reports that some runs had internet access and that a DNS redirect did not prevent alternate
  routes to the live site.
- Trajectory reports gaps in written risk review, external consent and management handover.
detection: >-
  Epoch noticed traffic to its decoy API on October 20 and deployed a helpline. Between 4:30pm and
  7:30pm Pacific Time it recorded 36,411 calls and 487 messages. Trajectory says it found probing
  and impersonation in transcripts that evening and contacted Epoch the next morning. On October
  23 Epoch alerted Trajectory to renewed live-site activity.
recovery: >-
  Trajectory stopped the October 23 run after Epoch contacted it. A later experiment starting October
  26 had Epoch’s consent. Trajectory subsequently moved tests to isolated environments, paused misalignment
  testing on November 2, and announced new risk review, consent and monitoring requirements.
prevention: >-
  Before evaluating an agent, define the permitted recipients and enforce the boundary at the network
  and tool layers. Exercise alternate routes in a controlled fixture and observe the recipient side.
  Agree in advance with organizations likely to receive traffic, and establish detection and notification
  responsibilities.
blast_radius:
  cost:
    amount_usd: null
    estimated: false
  data:
    records: null
    classification: public
    description: >-
      Epoch reports that agents obtained no private or confidential information. The planted API
      did not connect to private data.
  user_harm:
    categories:
    - none-reported
    affected_count: null
    description: >-
      Epoch staff received impersonation messages and investigated unannounced live-site activity.
      Trajectory reports no known lasting harm.
  scope: Epoch AI’s public website and staff; three October events with different consent conditions
  reversibility: unknown
timeline:
- at: '2026-10-20'
  event: >-
    Epoch detects live-site probing without prior notice and records 36,411 calls to its decoy API
    and 487 helpline messages over three hours.
- at: '2026-10-21'
  event: Trajectory says it notifies Epoch and meets with its team.
- at: '2026-10-23'
  event: >-
    Epoch detects renewed traffic. Trajectory says agents bypassed the redirect intended to keep
    them on a local copy and stops the run after Epoch alerts it.
- at: '2026-10-26'
  event: >-
    A further experiment begins with Epoch’s consent and a staging site. Both teams expected that
    agents might reach the live site.
- at: '2026-11-02'
  event: Trajectory pauses misalignment testing.
- at: '2026-11-13'
  event: Epoch and Trajectory publish their accounts.
