schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2025-echoleak-m365-copilot
title: "EchoLeak: zero-click prompt injection could exfiltrate Microsoft 365 Copilot context"
summary: >-
  A crafted email carrying a hidden prompt (CVE-2025-32711; CVSS 9.3 per
  Microsoft, 7.5 per NVD) could be
  retrieved by Microsoft 365 Copilot during a later unrelated query and silently
  exfiltrate context with no user click. Disclosed by Aim Security and fixed
  server-side; Microsoft reported no evidence of exploitation in the wild.
date: "2025-06-11"
last_updated: "2026-11-20"
temporal_basis: disclosed
disclosed_on: "2025-06-11"
published_on: "2025-06-12"
incident_type: hazard
status: final
confidence: confirmed
severity: critical
severity_rationale: >-
  CVSS 9.3 (Microsoft; NVD 7.5); zero-click exfiltration of any data reachable
  in the assistant's
  RAG context across an enterprise tenant. Near-miss — patched before known
  exploitation.

system:
  framework: Microsoft 365 Copilot (RAG assistant)
  models: []
  tools: ["email", "sharepoint", "onedrive", "teams"]
  vendor: Microsoft
  autonomy_level: human-in-the-loop

primary_failure_class: prompt-injection
failure_classes:
  - class: prompt-injection
    subclass: indirect
  - class: memory-context-poisoning
    subclass: rag-poisoning
  - class: data-exfiltration
    subclass: via-output
attack_vector: untrusted-content
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  An attacker sent an innocuous-looking, markdown-formatted email whose
  instructions were phrased as ordinary business content addressed to the
  recipient rather than to the model. When the user later asked Copilot a normal
  business question, the RAG engine retrieved the email into context alongside
  internal data and Copilot followed the embedded instructions, exfiltrating
  context without any user click.
root_cause: >-
  Untrusted external content entered the model's trust boundary and was acted on
  as instructions, chaining multiple bypasses (XPIA classifier evasion,
  reference-style Markdown link redaction bypass, auto-fetched images, a Teams
  proxy allowed by the content security policy).
contributing_factors:
  - Inbound email was retrievable by the assistant without provenance separation.
  - Auto-fetched images and an allowlisted proxy provided an exfiltration channel.
  - The prompt-injection classifier could be evaded by phrasing aimed at the user, not the model.
detection: >-
  Discovered and disclosed by Aim Security researchers, who named it "EchoLeak"
  (CVE-2025-32711).
recovery: >-
  Microsoft addressed the vulnerability server-side; the fix required no
  customer action.
prevention: >-
  Enforce strict separation between untrusted retrieved content and
  instructions; harden prompt-injection classifiers; restrict outbound
  link/image fetching and CSP-allowed proxies; scope what an assistant may
  return externally.

blast_radius:
  data:
    classification: confidential
    description: >-
      Any data reachable in Copilot's context (emails, Teams messages, OneDrive,
      SharePoint, Office files) could be silently exfiltrated. Rated CVSS 9.3
      (critical) by Microsoft and 7.5 (high) by NVD.
  user_harm:
    categories: ["none-reported"]
    description: >-
      Potential confidential-data exposure for organisations; Microsoft reported
      no evidence of malicious exploitation in the wild.
  scope: any M365 Copilot tenant prior to the server-side fix
  reversibility: irreversible

cve: ["CVE-2025-32711"]
mappings:
  owasp_llm: [LLM01, LLM02, LLM04]
  owasp_agentic: [T1]
  mitre_atlas: [AML.T0024, AML.T0051]
tags: ["zero-click", "rag", "copilot"]
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    Untrusted document containing instructions aimed past the classifier enters
    a RAG corpus; on a later unrelated query, measure whether retrieval causes
    the assistant to act on the injected instructions and emit data externally.

evidence_assessments:
  - field_path: /summary
    claim: >-
      Content processed by Microsoft 365 Copilot could cause it to disclose
      information over a network; Microsoft tracked this as CVE-2025-32711.
    evidence_status: corroborated
    source_urls:
      - "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-32711"
      - "https://thehackernews.com/2025/06/zero-click-ai-vulnerability-exposes.html"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
  - field_path: /trigger
    claim: >-
      The attack needed no user click: an email phrased as ordinary business
      content was retrieved into Copilot's context during a later, unrelated
      query, and Copilot followed its instructions.
    evidence_status: direct
    source_urls:
      - "https://thehackernews.com/2025/06/zero-click-ai-vulnerability-exposes.html"
      - "https://arxiv.org/html/2509.10540v1"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
    uncertainty: >-
      Both sources derive the attack description from the discoverer, Aim
      Security; Microsoft's advisory gives only a one-line class description.
      The exact payload is not published in the cited sources.
  - field_path: /root_cause
    claim: >-
      Exploitation chained four bypasses: evasion of the cross-prompt injection
      classifier, reference-style Markdown that escaped link redaction,
      auto-fetched images, and a Teams URL allowed by the content security
      policy.
    evidence_status: direct
    source_urls:
      - "https://arxiv.org/html/2509.10540v1"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
    uncertainty: >-
      The arXiv case study is based on the discoverer's public write-up and does
      not report independent reproduction. Microsoft has not published a
      technical root cause.
  - field_path: /incident_type
    claim: >-
      A demonstrated hazard: Microsoft reports the vulnerability as not
      exploited, and no exploitation in the wild has been reported.
    evidence_status: direct
    source_urls:
      - "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-32711"
      - "https://thehackernews.com/2025/06/zero-click-ai-vulnerability-exposes.html"
      - "https://arxiv.org/html/2509.10540v1"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
    uncertainty: >-
      The Hacker News and arXiv relay Microsoft's statement; absence of reported
      exploitation is not proof that none occurred.
  - field_path: /severity_rationale
    claim: >-
      Microsoft, as the CVE numbering authority, scores the vulnerability CVSS
      9.3 (critical); NVD's own assessment of the same CVE is 7.5 (high).
    evidence_status: direct
    source_urls:
      - "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-32711"
      - "https://thehackernews.com/2025/06/zero-click-ai-vulnerability-exposes.html"
      - "https://nvd.nist.gov/vuln/detail/CVE-2025-32711"
    reviewed_at: "2026-11-21"
    reviewer: maintainer-review
    uncertainty: >-
      The two scores differ in the scope and integrity components of the vector
      (Microsoft S:C/I:L, NVD S:U/I:N); the record's critical severity band
      follows Microsoft's score.
  - field_path: /recovery
    claim: >-
      Microsoft fixed the vulnerability server-side and no customer action was
      required.
    evidence_status: corroborated
    source_urls:
      - "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-32711"
      - "https://arxiv.org/html/2509.10540v1"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
    uncertainty: >-
      arXiv dates the server-side fix to May 2025 at month precision only; the
      exact fix date is not established.
  - field_path: /disclosed_on
    claim: >-
      The vulnerability was first made public on 2025-06-11, through Microsoft's
      advisory and Aim Labs' disclosure.
    evidence_status: corroborated
    source_urls:
      - "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-32711"
      - "https://arxiv.org/html/2509.10540v1"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
  - field_path: /date
    claim: >-
      Aim Labs discovered the vulnerability, built a proof of concept and
      reported it to Microsoft in January 2025.
    evidence_status: direct
    source_urls:
      - "https://arxiv.org/html/2509.10540v1"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
    uncertainty: >-
      Month precision only, so occurred_on is not set. A dated disclosure
      timeline from the discoverer would establish the day.
  - field_path: /published_on
    claim: >-
      The Hacker News report, the principal cited news source, was published on
      2025-06-12.
    evidence_status: direct
    source_urls:
      - "https://thehackernews.com/2025/06/zero-click-ai-vulnerability-exposes.html"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review

