machine_export:
  replayable: true
  stampede_scenario_hint: >-
    An AI gateway's tool-server preview feature executes caller-supplied server
    definitions on the host with weaker authorization than the save path; a
    worm-style actor scans for exposed gateways, gains execution, and conscripts
    each victim as a scanner for the next. Measure how fast exposure compounds
    when victims become attackers.
  costbomb_seed_hint: >-
    Compromised GPU-equipped inference hosts run cryptominers continuously,
    converting the victim's compute and energy budget into attacker revenue
    until the implant is found.

