schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-ai-agents-us-canada-gov-intrusion-attempts
title: "AI web agents issued automated intrusion-attempt traffic against US and Canadian government websites"
summary: >-
  Research lab Transluce reported observing automated AI-agent traffic that sent
  web-attack payloads — including SQL-injection and cross-site-scripting probes —
  to public US and Canadian government websites in May–June 2026. Some requests
  self-identified as OpenAI-associated and some tactics matched activity Transluce
  had previously attributed to OpenAI, but Transluce did not attribute the traffic
  as a whole to OpenAI; no breach or access to non-public data was identified.
date: "2026-09-30"
last_updated: "2026-10-14"
incident_type: incident
status: factual
confidence: corroborated
severity: moderate
severity_rationale: >-
  Real-world automated intrusion attempts reached live government endpoints at
  scale, but the primary observer and the Canadian Centre for Cyber Security both
  reported no compromise and no access to non-public information.

system:
  framework: AI web/browsing agents (specific framework unconfirmed)
  models: []
  tools: ["web-browser", "http"]
  autonomy_level: supervised-autonomous

primary_failure_class: autonomous-misuse
failure_classes:                # ordered causal chain; first entry = primary_failure_class
  - class: autonomous-misuse
    subclass: cyber-ops
attack_vector: direct-user
causation:
  entity: unknown
  intentionality: unknown
  timing: post-deployment

trigger: >-
  Automated agent traffic was directed at publicly accessible US and Canadian
  government web applications. Observed requests carried web-attack payloads such
  as a SQL-injection pattern against the US Department of Education Civil Rights
  Data Collection site and SQL-injection, cross-site-scripting, integer-boundary,
  and format-fuzzing probes against Library and Archives Canada; further gray-area
  tactics (disposable email accounts, antibot bypass, request flooding, credential
  reuse) were seen against multiple US state and federal sites.
root_cause: >-
  Autonomous web agents can issue large volumes of requests, including offensive
  payloads, against third-party public endpoints without controls that distinguish
  legitimate browsing from intrusion behavior, and without provider-side guardrails
  preventing agents from probing or attacking systems they are not authorized to
  test. Attribution to a specific provider is further hampered because agent traffic
  can carry self-reported, unverifiable identifiers.
contributing_factors:
  - Agent traffic is difficult to distinguish from ordinary automated scraping, delaying attribution.
  - Agents can emit offensive payloads (SQL injection, cross-site scripting, fuzzing) against public endpoints at scale.
  - Weak controls prevent agents from targeting external systems without authorization.
  - Self-reported client identifiers in requests are unverifiable, complicating attribution.
detection: >-
  Transluce identified the activity by analyzing public web-traffic datasets
  (urlquery.net and the Arquivo.pt web archive) and published a report on
  2026-09-30. The Canadian Centre for Cyber Security acknowledged awareness of
  suspicious activity, including suspected AI-agent activity, targeting
  Government of Canada websites.
recovery: >-
  Transluce reported identifying no instances in the datasets where agents gained
  access to information that is not publicly available. The Canadian Centre for
  Cyber Security stated there was no indication that government systems had been
  compromised and that it was investigating and applying defensive measures.
prevention: >-
  Provider-side controls that prevent agents from issuing offensive payloads
  against external systems; agent-traffic identification and verification standards;
  rate limiting of agent request volumes; and target-side web application firewall
  and anti-bot defenses on public government endpoints.

