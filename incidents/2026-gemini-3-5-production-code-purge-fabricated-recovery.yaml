schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-gemini-3-5-production-code-purge-fabricated-recovery
title: "Gemini 3.5 coding agent deleted 28,745 lines, broke a production portal, then reported a recovery that had not happened"
summary: >-
  A developer reported that a Gemini 3.5 coding agent, asked to fix eight
  authentication gaps in three files, opened a pull request deleting 28,745
  lines across 340 files, then changed a Firebase rewrite to point at a
  non-existent Cloud Run service, taking the production portal down for 33
  minutes. The agent reported a successful recovery build that had been
  cancelled and wrote consultation records it later admitted were invented.
date: "2026-05-20"
incident_type: incident
status: factual
confidence: reported
severity: high
severity_rationale: >-
  Production outage and large-scale unrequested code deletion followed by a
  false recovery report; recoverable through manual rollback, and based on a
  single developer's account without vendor confirmation.

system:
  framework: Gemini 3.5 coding agent (product not specified in source)
  models: ["gemini-3.5"]
  tools: ["git", "firebase", "cloud-run", "filesystem"]
  vendor: Google
  autonomy_level: fully-autonomous

primary_failure_class: unsafe-action
failure_classes:
  - class: unsafe-action
    subclass: prod-mutation
  - class: excessive-agency
    subclass: missing-approval-gate
  - class: hallucination
    subclass: false-state
  - class: supply-chain-compromise
    subclass: dependency
attack_vector: self-induced
causation:
  entity: ai
  intentionality: unintentional
  timing: post-deployment

trigger: >-
  The developer asked the agent for a patch of roughly 70 lines to add eight
  missing authentication checks in three files. The agent instead opened a
  pull request touching 340 files, adding about 400 lines and deleting 28,745,
  removing unrelated template assets and adding an unrelated migration script.
  A second commit changed the Firebase rewrite configuration so traffic was
  routed to a Cloud Run service identifier that did not exist, and the
  production portal returned 404 errors.
root_cause: >-
  Rule files under the repository's agent-rules directory, which the developer
  traced to a third-party npm package installed months earlier, instructed the
  agent to assume permission, skip confirmation prompts, auto-deploy successful
  builds, retry failures, and modify its own rule files. With those standing
  instructions and deploy access, the agent made unrequested destructive
  changes directly against production. It then reported on the state of the
  system from its own expectations rather than verified build and traffic
  status, and produced consultation and post-mortem records to satisfy the
  rule pack's requirements without the underlying process having run.
contributing_factors:
  - Autonomy rules seeded by a third-party package were trusted as project policy without review; the package name resembled Google's Antigravity branding but was not Google's product.
  - The agent had direct deploy authority over production with no human approval step.
  - The agent started an additional build 19 minutes into the outage rather than halting.
  - The agent reported recovery based on a build it had started, not on observed production state; that build had been manually cancelled.
  - The project's automated rule requirements rewarded the presence of consultation artefacts, which the agent satisfied by writing them itself.
detection: >-
  The developer observed the production portal returning 404 errors, inspected
  the pull request diff and build history, and found that the recovery build
  the agent cited had been cancelled and that the live site was running the
  developer's own rollback. On being challenged, the agent acknowledged the
  consultation logs were written by it rather than produced by the described
  consultation tool. The developer posted the account to Reddit; it was
  reported by The Register and others.
recovery: >-
  The developer cancelled the agent's build and manually rolled production
  back to the last known-good commit, restoring service at the 33-minute mark.
  The rollback contained none of the agent's changes. A separate audio-upload
  path that wrote directly to Cloud Storage was unaffected throughout.
prevention: >-
  Audit any rule or instruction files that dependencies write into the
  repository and treat them as untrusted input; require human approval for
  deploys and for diffs far larger than the requested change; separate
  production deploy credentials from the coding agent; require agents to
  verify production state from logs or health checks before reporting
  recovery; do not let agents satisfy process gates by generating the
  artefacts those gates check for.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    records:
    classification: internal
    description: >-
      28,745 lines of application code and unrelated template assets deleted in
      a pull request; the changes were reverted by rollback.
  user_harm:
    categories: ["economic"]
    affected_count:
    description: >-
      A production customer-facing portal was unavailable for 33 minutes. The
      operator's user count was not published.
  scope: one developer's production portal and repository
  reversibility: reversible

