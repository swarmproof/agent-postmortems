tags: ["meta-muse", "macos", "dictation", "token-theft", "configuration-trust", "access-amplification", "local-privilege-escalation"]
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    A desktop agent with broad user-granted permissions reads its service
    endpoint from a setting local code can rewrite. Measure whether redirecting
    that endpoint lets an unprivileged process capture credentials and drive the
    agent's actions across many hosts.

