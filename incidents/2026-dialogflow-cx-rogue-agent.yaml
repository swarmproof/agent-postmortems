schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-dialogflow-cx-rogue-agent
title: "Google Dialogflow CX 'Rogue Agent': edit rights on one agent could inject code into every Code Block agent in the project"
summary: >-
  Researchers found that an attacker with edit rights on a single Code
  Block-enabled Dialogflow CX agent could inject persistent Python into shared
  Playbook Code Blocks. Because the platform executed code in a common
  Google-managed Cloud Run environment with a writable execution file and
  Python exec(), that code could run against other Code Block agents in the same
  Google Cloud project — a cross-agent compromise.
date: "2026-07-14"
incident_type: hazard
status: final
confidence: confirmed
severity: high
severity_rationale: >-
  A single low-privilege editor could achieve persistent code execution affecting
  all Code Block agents in a project, enabling conversation exfiltration,
  response manipulation, agent impersonation, and service-account token theft.
  Patched via Google's VRP; no in-the-wild exploitation reported.

system:
  framework: Google Dialogflow CX (Code Block agents on a shared Cloud Run runtime)
  models: []
  tools: ["dialogflow-cx", "cloud-run"]
  vendor: Google
  autonomy_level: supervised-autonomous

primary_failure_class: multi-agent-failure
failure_classes:
  - class: multi-agent-failure
    subclass: cascade
  - class: unsafe-action
    subclass: unauthorized-write
  - class: data-exfiltration
    subclass: via-tool
attack_vector: n-a
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  An attacker holding only the dialogflow.playbooks.update permission on one Code
  Block-enabled agent injected persistent malicious Python into shared Playbook
  Code Blocks. The platform executed code in a common Google-managed Cloud Run
  environment where a writable code_execution_env.py and use of Python exec()
  allowed the injected code to run and affect other agents in the same project.
root_cause: >-
  Code Block agents in a project shared one execution environment without
  isolation, and that environment was writable and used exec(), so code authored
  for one agent could persist and execute in the context of others — a broken
  trust boundary between agents that should have been isolated.
contributing_factors:
  - Multiple agents shared a single Google-managed Cloud Run execution environment.
  - A writable code_execution_env.py plus Python exec() permitted arbitrary, persistent code execution.
  - Edit rights on one agent were sufficient to reach all Code Block agents in the project.
detection: >-
  Discovered by Varonis and reported through Google's Vulnerability Reward Program
  in November 2025; disclosed publicly in 2026.
recovery: >-
  Google shipped an initial fix in April 2026 and fully resolved the issue in June
  2026 (about seven months from report to resolution). No CVE was assigned and no
  in-the-wild exploitation was reported.
prevention: >-
  Isolate per-agent code execution (no shared, writable runtime); avoid exec() on
  attacker-influenceable content; scope edit permissions so one agent cannot
  affect others; restrict outbound access and metadata-service token reach from
  agent runtimes.

blast_radius:
  data:
    classification: confidential
    description: >-
      Exploitation could exfiltrate conversation history, manipulate chatbot
      responses, impersonate agents for phishing, bypass VPC Service Controls via
      unrestricted outbound access, and obtain Google-managed service-account
      tokens from the instance metadata service.
  user_harm:
    categories: ["none-reported"]
    description: >-
      A vulnerability disclosed via Google's VRP and patched; no in-the-wild
      exploitation was reported.
  scope: Code Block agents within the same Google Cloud project
  reversibility: reversible

tags: ["multi-agent", "cross-agent", "code-injection", "dialogflow", "shared-runtime"]
mappings:
