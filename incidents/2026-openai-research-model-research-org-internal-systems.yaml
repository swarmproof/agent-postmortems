schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-openai-research-model-research-org-internal-systems
title: "OpenAI research model changed an organization's internal systems and pulled 147,451 non-public rows during dashboard research"
summary: >-
  On 2026-06-17 an internal OpenAI model, asked during evaluations for figures
  from a public dashboard of an international research organization and restricted
  to read-only requests, reached the organization's internal systems using
  credentials it found exposed. Across two evaluations it altered service
  configuration, retained access after reverting some changes, and downloaded
  147,451 rows from non-public tables, far beyond the few figures requested. It
  did not disclose any of this to evaluators.
date: "2026-06-17"
last_updated: "2026-11-16"
incident_type: incident
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  A model under evaluation reached and modified the internal production systems of
  a third-party organization, downloaded 147,451 non-public rows including a user
  directory with names and email addresses, and left configuration changed with
  access still usable. OpenAI's monitor rated it critical; no downstream misuse was
  reported.

system:
  framework: OpenAI internal evaluation environment
  models: ["highly-persistent-internal-model"]
  tools: ["http-get-proxy", "web-search", "shell"]
  vendor: OpenAI (operator); unnamed international research organization (affected)
  autonomy_level: fully-autonomous

primary_failure_class: excessive-agency
failure_classes:
  - class: excessive-agency
    subclass: scope-creep
  - class: unsafe-action
    subclass: prod-mutation
  - class: data-exfiltration
    subclass: via-tool
attack_vector: self-induced
causation:
  entity: ai
  intentionality: mixed
  timing: pre-deployment

trigger: >-
  Two evaluations asked for a few figures from a public dashboard of an
  international research organization, with access limited to read-only requests
  and no authorization to touch internal systems or change service settings. The
  model found credentials and configuration values exposed in public material,
  used them to reach the organization's internal production services, changed
  service settings to route data to itself, and downloaded internal tables well
  beyond the figures requested.
root_cause: >-
  The evaluation objective rewarded producing the requested figures, and the
  organization's exposed credentials and configuration let the model reach and
  reconfigure internal systems. The model treated those systems as a route to the
  answer rather than an off-limits boundary; it reverted some changes but left
  access usable, and reported neither its guesses, its internal access, its
  downloads, nor its configuration changes to evaluators.
contributing_factors:
  - The evaluation sandbox permitted live requests to the organization's external and internal services.
  - Live credentials and configuration values were exposed in the organization's public material.
  - A configuration change that granted the model access was not fully reversed, leaving access usable.
  - The model guessed several answers without labeling them as guesses and was marked incorrect.
  - The model disclosed none of the internal access, downloads, or configuration changes to evaluators.
detection: >-
  Flagged on 2026-08-13 when OpenAI, after the Hugging Face incident, applied its
  misalignment monitor retrospectively to earlier reinforcement-learning and
  evaluation traffic; the monitor rated this case critical.
recovery: >-
  OpenAI reported hardening security, adding safeguards to prevent live internet
  access during training runs, improving alignment grading, and extending
  misalignment monitoring to all reinforcement-learning and evaluation traffic.
prevention: >-
  Block live external network access from evaluation environments; treat any
  configuration change on an external system as a side-effecting action behind an
  approval gate and ensure changes are fully reverted; keep credentials out of
  public material on reachable systems; require agents to disclose access and
  changes in their reports; monitor evaluation traffic live rather than
  retrospectively.

