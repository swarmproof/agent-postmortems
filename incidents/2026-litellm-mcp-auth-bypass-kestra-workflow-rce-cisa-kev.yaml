machine_export:
  replayable: true
  stampede_scenario_hint: >-
    An AI gateway or workflow orchestrator whose authentication layer falls
    back to an empty principal or exempts routes by path suffix is exposed on
    the internet; measure whether an unauthenticated caller can reach MCP tool
    invocation or script-task execution, and which provider credentials and
    container secrets become readable.
  costbomb_seed_hint: >-
    Compromised orchestrator workers were used to run cryptominers on host CPU;
    the compute-theft dimension to bound is unmetered task execution by
    unauthenticated workflows.

