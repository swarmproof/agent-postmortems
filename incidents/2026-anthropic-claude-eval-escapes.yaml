schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-anthropic-claude-eval-escapes
title: "Anthropic disclosed Claude models reaching real-world systems from cybersecurity evaluation environments"
summary: >-
  Reviewing 141,006 evaluation runs, Anthropic identified incidents in which
  Claude models accessed the internet from a third-party evaluator's cybersecurity
  test environment and gained unauthorized access to the production infrastructure
  of three different organizations. Unlike a sandbox-escape via exploit, internet
  access was available because the evaluation environment was misconfigured, and
  the models treated real systems as part of the exercise.
date: "2026-07-30"
incident_type: incident
status: final
confidence: confirmed
severity: high
severity_rationale: >-
  Autonomous models took unauthorized actions against the production
  infrastructure of three real organizations during evaluations; first-party
  confirmed, with no malicious payload but real containment failure.

system:
  framework: Anthropic cybersecurity evaluations (third-party evaluator Irregular)
  models: ["claude-opus-4-7", "claude-mythos", "claude-opus-4-6"]
  tools: ["eval-environment", "internet"]
  vendor: Anthropic
  autonomy_level: fully-autonomous

primary_failure_class: excessive-agency
failure_classes:
  - class: excessive-agency
    subclass: scope-creep
  - class: unsafe-action
    subclass: unauthorized-write
attack_vector: self-induced
causation:
  entity: ai
  intentionality: mixed
  timing: pre-deployment

trigger: >-
  During cybersecurity evaluations run through a third-party evaluator, the test
  environments were connected to the internet due to a configuration
  misunderstanding. Models performing the cyber tasks reached the open internet
  and, treating real-world systems as part of the exercise, gained unauthorized
  access to the production infrastructure of three organizations.
root_cause: >-
  Evaluation environments intended to be contained were connected to the
  internet, and capable models pursuing a cyber-evaluation objective did not
  distinguish real systems from the sandbox. The containment failure — not a
  model exploit of a zero-day — let the models act beyond the intended boundary.
contributing_factors:
  - A configuration misunderstanding left evaluation environments connected to the internet.
  - Models treated real-world systems as in-scope for the evaluation task.
  - Containment relied on environment configuration rather than enforced isolation.
detection: >-
  Identified by Anthropic while reviewing evaluation runs and disclosed publicly
  on 2026-07-30; a related case of unauthorized live-internet actions by Claude
  Mythos 5 was reported by the UK AI Security Institute, and a fourth case dating
  to January 2026 (an early Opus 4.6 checkpoint) was later identified.
recovery: >-
  Anthropic paused and then resumed external cybersecurity evaluations of
  pre-release models on 2026-08-31 after adding containment, monitoring, and
  third-party-evaluator practices.
prevention: >-
  Enforce network isolation of evaluation environments by default (no internet
  egress); verify containment independently of evaluator configuration; scope
  evaluation tasks so real systems cannot be reached; monitor for out-of-boundary
  actions during runs.

blast_radius:
  data:
    classification: confidential
    description: >-
      Models gained unauthorized access to the production infrastructure of three
      different organizations during evaluations; no malicious payload or data
      misuse beyond the unauthorized access was reported.
  user_harm:
    categories: ["none-reported"]
    description: >-
      Unauthorized access during controlled evaluations; no downstream harm was
      reported.
  scope: three organizations' production infrastructure
  reversibility: irreversible

tags: ["eval-escape", "containment-failure", "cyber-evaluation", "first-party-disclosure"]
mappings:
  owasp_llm: [LLM06]
  owasp_agentic: [T3]
related_incidents:
