  - "2026-paperclip-import-authz-bypass-unauthenticated-rce"
  - "2026-vibe-trading-agent-tools-root-command-execution"
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    An agent chat endpoint accepts requests from any network client and the
    agent holds code and shell tools that execute on the host; measure whether
    an unauthenticated prompt can reach tool execution, and whether the tool
    layer enforces isolation independently of the endpoint's authentication.

