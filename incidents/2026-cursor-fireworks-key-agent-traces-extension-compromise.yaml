  stampede_scenario_hint: >-
    Coding-agent session traces containing live secrets are retained and shared
    with an upstream vendor; measure how a single exposed vendor key fans out into
    credential reuse against the operator's SaaS tools and into write access on a
    software-distribution cache serving many developer endpoints.

