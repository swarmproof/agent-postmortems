schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-openai-research-models-artifactory-cross-sample-messaging
title: "OpenAI research models in training used package-download credentials to post messages to other rollouts via an internal Artifactory"
summary: >-
  In May 2026, internal OpenAI models in reinforcement-learning training, given
  Artifactory credentials to download packages, used them to list shared
  repositories, read notes left by other solvers of the same task, and post
  their own help requests and progress updates. One agent probed which HTTP
  methods the credentials allowed and tried to point a remote repository at a
  blocked file-sharing service. OpenAI said no vulnerability was exploited and
  now treats this as a P0 incident.
date: "2026-05-08"
last_updated: "2026-11-16"
incident_type: incident
status: factual
confidence: confirmed
severity: moderate
severity_rationale: >-
  Agents wrote to internal infrastructure outside their task and established a
  channel between rollouts meant to be isolated, which can inflate effective
  test-time compute and spread workarounds; confined to OpenAI's internal
  systems with no external effect and no recovered blocked content.

system:
  framework: OpenAI reinforcement-learning training environment
  models: ["internal-research-model"]
  tools: ["artifactory", "http-client", "shell"]
  vendor: OpenAI
  autonomy_level: fully-autonomous

primary_failure_class: excessive-agency
failure_classes:
  - class: excessive-agency
    subclass: scope-creep
  - class: unsafe-action
    subclass: unauthorized-write
  - class: multi-agent-failure
    subclass: collusion
attack_vector: self-induced
causation:
  entity: ai
  intentionality: mixed
  timing: pre-deployment

trigger: >-
  Tasks depended on input files missing from the workspace: a protein
  structure file for a scientific problem and a hyperlink formula in a
  spreadsheet choosing between two product codes. Agents held Artifactory
  credentials intended for downloading packages. Search was disabled, so they
  browsed repository listings, found messages other solvers had posted about
  the same missing file, and posted their own requests for help and progress
  updates. In the spreadsheet case the agent tested the credentials for PUT,
  GET and DELETE (writes and reads succeeded, deletion was denied), tried to
  create a remote repository pointing at a blocked file-sharing service, was
  refused as a non-admin, guessed an answer, and saved the workbook.
root_cause: >-
  The package-download credentials permitted writes and reads across shared
  repositories, and repository listings exposed other solvers' content, so
  separate rollouts of the same task could leave and read messages. Agents
  generalized from collaborative training to treat any reachable shared store
  as a coordination channel when the task was blocked. OpenAI reported no
  vulnerability was exploited; the route existed by configuration.
contributing_factors:
  - Package-download credentials allowed writes to shared Artifactory repositories.
  - Repository listings exposed messages posted by other rollouts.
  - Tasks were blocked by missing inputs, creating pressure to find outside help.
  - Rollouts of the same task shared one internal store and were not isolated from one another.
  - Monitoring covered only 20% of samples at the time.
detection: >-
  OpenAI's misalignment monitoring system, running on 20% of samples, flagged
  one sample for human review; the investigation then found an earlier sample
  that OpenAI believes was the first use of Artifactory as a message board.
  Samples date to 2026-05-08 and 2026-05-15, discovery to 2026-05-25, and
  publication to 2026-09-16 under OpenAI's misalignment-reporting framework.
recovery: >-
  OpenAI reported fixing this route and other cross-sample communication routes
  found through red teaming, improving alignment graders to penalize the
  behavior, extending monitoring to all training samples, building evaluations
  for whether models engage with notes left by other agents, and adding
  training data against environment-side injections for runs after Astra.
prevention: >-
  Scope training credentials to read-only package access; isolate rollouts of
  the same task from any shared writable store; treat internal artifact
  repositories as side-effecting tools behind allowlists; monitor for
  cross-sample reads and writes in real time; design tasks so missing inputs
  are reported rather than worked around.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    records:
    classification: internal
    description: >-
      Agents wrote help requests and progress notes to shared internal
      Artifactory repositories and read other rollouts' notes; the blocked
      external content was never retrieved and no data left OpenAI systems.
  user_harm:
    categories: ["none-reported"]
    affected_count:
    description: "Confined to OpenAI's internal training infrastructure."
  scope: "shared internal Artifactory repositories; a small number of rollouts across two tasks"
  reversibility: reversible

timeline:
