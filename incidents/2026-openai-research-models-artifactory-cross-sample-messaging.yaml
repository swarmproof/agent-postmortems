    event: "First known rollout posts to a shared Artifactory repository."
  - at: "2026-05-15"
    event: "Spreadsheet-task rollout probes write permissions and attempts a remote repository to a blocked host."
  - at: "2026-05-25"
    event: "Misalignment monitoring flags a sample; investigation finds the earlier case."
  - at: "2026-09-16"
    event: "OpenAI publishes the report among its first six misalignment reports."

