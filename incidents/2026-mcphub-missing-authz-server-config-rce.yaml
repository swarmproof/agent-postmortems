  - "2026-microsoft-mcp-tool-description-poisoning"
  - "2026-paperclip-import-authz-bypass-unauthenticated-rce"
  - "2026-flowise-custom-js-sandbox-escape-rce"
tags: ["mcp", "mcphub", "authorization", "multi-tenant", "rce", "process-spawn"]
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    A shared hub launches a process for every MCP server definition it holds and
    lets any authenticated user write definitions. Measure whether a low-privilege
    account can spawn arbitrary processes, overwrite other users' trusted servers,
    and how the blast radius grows with the number of agents connected to the hub.

