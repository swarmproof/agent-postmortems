schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-litellm-pypi-trivy-credential-stealer-poisoning
title: "Malicious LiteLLM 1.82.7 and 1.82.8 PyPI releases ran a credential stealer on import after a poisoned CI scanner leaked publishing tokens"
summary: >-
  On 2026-03-24 two malicious releases of the LiteLLM AI gateway, 1.82.7 and
  1.82.8, were published directly to PyPI using tokens a compromised Trivy scanner
  in LiteLLM's CI pipeline had harvested. The payload stole environment secrets,
  SSH keys and cloud, Kubernetes and database credentials; a .pth file in 1.82.8
  ran on any Python startup. The packages were live about 40 minutes. CloudSEK
  later mapped roughly 434,000 captured files to more than 2,500 organisations.
date: "2026-03-24"
last_updated: "2026-11-16"
incident_type: incident
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  A credential stealer reached the public PyPI registry on a widely used AI
  gateway and ran on import, with one variant executing on any Python startup;
  reconstructed exposure data later mapped roughly 434,000 captured files to more
  than 2,500 organisations, and credentials remained reusable long after removal.

system:
  framework: LiteLLM (AI gateway / LLM proxy); CircleCI build pipeline; Trivy CI dependency
  models: []
  tools: ["pypi", "circleci", "trivy", "aws", "kubernetes"]
  vendor: BerriAI (LiteLLM)
  autonomy_level: unknown

primary_failure_class: supply-chain-compromise
failure_classes:
  - class: supply-chain-compromise
    subclass: dependency
  - class: data-exfiltration
    subclass: via-tool
attack_vector: supply-chain
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  On 2026-03-24, beginning about 10:39 UTC, litellm 1.82.7 and 1.82.8 were
  uploaded directly to PyPI, bypassing the project's CI release path and carrying
  no matching GitHub release tags. Version 1.82.7 hid its payload in the gateway
  module proxy_server.py, which ran when a victim imported litellm.proxy. Version
  1.82.8 added litellm_init.pth, which executes on any Python startup, so no
  import was needed and script-ignoring install flags did not prevent it. The
  payload was a credential stealer that scanned for environment variables, SSH
  keys, cloud provider credentials, Kubernetes tokens and database passwords and
  exfiltrated them to a domain resembling the project's own.
root_cause: >-
  The maintainers state that the compromise originated from the Trivy dependency
  used in LiteLLM's CI security-scanning workflow. A prior compromise of Trivy
  published a poisoned scanner that LiteLLM's pipeline installed unpinned; the
  scanner ran in a CI environment where all steps shared one context and static
  PyPI, GHCR and Docker publishing credentials were present as environment
  variables, so it could read long-lived release tokens. Those tokens were then
  used to publish the malicious versions straight to PyPI. The failure chain was
  an unpinned CI dependency with access to secrets it did not need, in a pipeline
  without step isolation or ephemeral credentials.
contributing_factors:
  - Trivy was installed unpinned in CI, so a poisoned upstream release flowed into the build.
  - CI steps shared one environment holding static PyPI, GHCR and Docker publishing credentials.
  - Release credentials were long-lived static secrets rather than short-lived or workload-scoped.
  - The .pth payload in 1.82.8 executed on any Python startup, defeating import-only and install-script defenses.
  - Malicious versions were uploaded directly to PyPI, bypassing the project's CI release path and provenance.
detection: >-
  Researchers tracked warnings from the actor on the morning of 2026-03-24 and
  identified LiteLLM as the target within hours; a community security issue was
  opened at 11:48 UTC and StepSecurity published the first analysis of the
  malicious wheel. PyPI quarantined the packages after about 40 minutes.
recovery: >-
  The compromised packages were removed from PyPI by about 16:00 UTC on
  2026-03-24 and maintainer credentials rotated; v1.82.6 was identified as the
  last clean release. The maintainers engaged Google's Mandiant for forensics and
  Veria Labs for review, rebuilt the release pipeline with isolated environments
  and ephemeral credentials (PyPI Trusted Publisher and token-based GHCR auth),
  began cosign-signing Docker images from v1.83.0-nightly, pinned Actions and
  dependencies with cooldowns, and released a clean v1.83.0. The official Docker
  proxy image, which pins dependencies, was reported unaffected. Users were
  advised to find and remove 1.82.7 or 1.82.8 and litellm_init.pth and rotate all
  secrets reachable from affected systems.
prevention: >-
  Pin CI dependencies to verified hashes and apply upgrade cooldowns; isolate CI
  steps so scanning cannot reach release credentials; use short-lived trusted
  publishing instead of static tokens; sign and attest release artifacts so
  direct-to-registry uploads are rejected; and scan for payloads that run on
  Python startup via .pth files rather than only on import or install.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    records: 434000
    classification: credentials
    description: >-
      The stealer swept SSH keys, AWS, GCP and Azure credentials including
      instance-metadata tokens, Kubernetes tokens and service-account data, .env
      files and CI/CD secrets, LLM API keys and gateway configuration, repository
      and registry publishing tokens, and database URLs. CloudSEK reconstructed an
      exposure dataset of roughly 434,000 captured files mapped to more than 2,500
      organisations, which it describes as potential exposure rather than confirmed
      compromise; Hudson Rock separately analysed a 153 GB archive of 433,909 files
      and attributed 118,829 CI-runner dumps to 2,488 corporate domains.
  user_harm:
    categories: ["economic"]
    affected_count:
    description: >-
      Credential exposure on developer hosts, CI runners and Docker builds that
      installed 1.82.7 or 1.82.8 during the window; reconstructed data maps
      exposure to more than 2,500 organisations, though these figures reflect
      exposure, not confirmed breach of each named organisation.
  scope: "litellm PyPI releases 1.82.7 and 1.82.8, live ~40 minutes on 2026-03-24; exposure mapped to 2,500+ organisations"
  reversibility: irreversible

timeline:
  - at: "2026-03-19"
    event: "A poisoned Trivy release is published upstream using a leaked automation token."
  - at: "2026-03-24"
    event: "litellm 1.82.7 and 1.82.8 uploaded directly to PyPI from about 10:39 UTC; quarantined after about 40 minutes and deleted by about 16:00 UTC."
  - at: "2026-03-27"
    event: "LiteLLM publishes a security townhall update describing cause and remediation."
  - at: "2026-03-30"
    event: "A clean v1.83.0 is released through a rebuilt CI pipeline."
  - at: "2026-07-02"
    event: "An FBI FLASH advisory warns that affiliated actors may weaponise harvested credentials later."
  - at: "2026-08-11"
    event: "CloudSEK publishes exposure data sizing the campaign at roughly 434,000 captured files and 2,500+ organisations."

