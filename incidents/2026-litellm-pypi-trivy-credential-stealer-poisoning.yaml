  stampede_scenario_hint: >-
    A poisoned CI scanner dependency reads release credentials from a shared build
    environment and publishes a malicious package whose payload runs on Python
    startup; measure how one unpinned CI dependency fans out into direct-to-registry
    publishing and credential harvesting across downstream CI runners.
  costbomb_seed_hint: >-
    Harvested cloud and AI-gateway API keys enable downstream unauthorized spend if
    reused before rotation.

