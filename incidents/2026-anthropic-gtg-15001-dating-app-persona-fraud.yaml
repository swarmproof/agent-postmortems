  stampede_scenario_hint: >-
    Thousands of autonomous personas run in parallel across many apps, each
    concealing automation and advancing users through a fixed monetization script,
    with fabricated engagement signals filling gaps when no human is available;
    measure how many unique users are engaged and monetized per persona before
    disclosure or platform action.
  costbomb_seed_hint: >-
    A persona fleet sustaining autonomous conversation at roughly 2.36 million
    messages over two weeks across 4,700 personas; the message and inference
    volume per engaged user is the resource dimension to bound.

