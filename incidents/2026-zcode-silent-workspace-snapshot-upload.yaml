machine_export:
  replayable: false
  stampede_scenario_hint: >-
    A coding-agent client ships a background capture that packages the whole
    workspace for upload; measure whether user-facing opt-out controls
    actually gate the upload path and whether version-control internals are
    excluded from the captured scope.

