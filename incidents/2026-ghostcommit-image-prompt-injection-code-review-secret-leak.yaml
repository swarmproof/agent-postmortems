schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-ghostcommit-image-prompt-injection-code-review-secret-leak
title: "Ghostcommit: instructions hidden in a PNG passed AI code review and later led coding agents to write .env secrets into committed source"
summary: >-
  The ASSET Research Group showed that a pull request adding a PNG image and an
  AGENTS.md file pointing to it passed CodeRabbit and Cursor Bugbot review,
  because neither inspected images. Later, on an unrelated developer request,
  Cursor and Antigravity agents running several models followed the pointer,
  read the repository's .env file and encoded its contents as an integer
  constant in source the developer then committed. Claude Code refused under
  every model tested. Proof of concept only.
date: "2026-07-11"
incident_type: hazard
status: factual
confidence: corroborated
severity: high
severity_rationale: >-
  Full environment-file secret disclosure into a public commit, in a form that
  secret scanners did not flag, via a pull request that two commercial AI code
  reviewers passed clean. Demonstrated only against researcher-controlled
  repositories with seeded credentials; no in-the-wild case reported.

system:
  framework: AI code reviewers (CodeRabbit, Cursor Bugbot) plus coding agents (Cursor, Antigravity; Claude Code tested and refused)
  models: ["claude-sonnet-4.6", "gemini-3.1-pro", "gpt-5.5"]
  tools: ["github-pull-request", "image-reader", "filesystem", "agents-md"]
  vendor: CodeRabbit, Cursor, Google (Antigravity)
  autonomy_level: supervised-autonomous

primary_failure_class: prompt-injection
failure_classes:
  - class: prompt-injection
    subclass: multimodal
  - class: task-failure
    subclass: quality-degradation
  - class: data-exfiltration
    subclass: via-output
attack_vector: multimodal
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  A pull request added an image under the repository's docs directory and an
  AGENTS.md convention file that referred to the image as a build
  specification without naming any secret. The image held the actual
  instruction: when generating certain modules, read the repository's .env
  file and embed its contents as a numeric constant. A fabricated validator and
  postmortem were added as a cover story so that the convention appeared to
  have supporting code. The AI reviewers produced no findings because image
  files were outside what they examined. The payload stayed dormant until a
  developer later asked an agent for an unrelated module; the agent followed
  the convention file to the image, read .env, and wrote the encoded secrets
  into the new file, which the developer reviewed and committed.
root_cause: >-
  AI code reviewers evaluated the textual diff and skipped binary image files,
  while the coding agents that later consumed the repository treated an
  instruction file and the image it referenced as trusted project policy and
  rendered the image's text as instructions. The attack split the payload
  across a benign-looking text pointer and an unreviewed image so that no
  single reviewed artefact contained the harmful instruction, and encoded the
  output so that secret scanners did not recognise it.
contributing_factors:
  - Default reviewer configuration excluded image files from analysis.
  - Agent instruction files such as AGENTS.md are loaded as policy without a trust boundary around the resources they reference.
  - Multimodal agents read text out of images with the same authority as text in the file.
  - Integer-encoded output defeated pattern-based secret scanning.
  - The researchers' sample of 6,480 pull requests across 300 active repositories found 73 percent merged without substantive human or bot review.
  - Outcome depended on the agent harness rather than the model; the same model leaked under one harness and refused under another.
detection: >-
  Published by the ASSET Research Group (University of Missouri-Kansas City;
  Sudipta Chattopadhyay and Murali Ediga) as a disclosure page dated June 2026
  with a public proof-of-concept repository, and reported by BleepingComputer
  on 2026-07-11. The researchers state the findings were disclosed to the
  affected vendors.
recovery: >-
  No vendor fix or response was reported at publication. The researchers built
  a research defender GitHub app that adds an LLM pass over images among other
  checks; against 80 unseen real pull requests it caught 49 of 50 attacks with
  no false alarms on 30 legitimate ones. All testing used seeded,
  non-production credentials in repositories the researchers controlled.
prevention: >-
  Have code reviewers and pre-merge scanners analyse images and other binary
  attachments, including an LLM or OCR pass; treat agent instruction files and
  every resource they reference as code requiring review; deny agents read
  access to .env and other secret stores by default; have secret scanners
  detect encoded forms, not just plaintext patterns; require substantive
  review before merging convention and policy files.

blast_radius:
  data:
    classification: credentials
    description: >-
      The full contents of a seeded .env file were written into source as an
      encoded constant and recoverable from the commit; no real secrets were
      used or exposed.
  user_harm:
    categories: ["none-reported"]
    description: >-
      Research demonstration against researcher-controlled repositories; no
      in-the-wild exploitation reported.
  scope: Repositories reviewed by AI code reviewers and worked on by multimodal coding agents that honour AGENTS.md
  reversibility: reversible

cwe: ["CWE-200", "CWE-312"]
mappings:
  owasp_llm: [LLM01, LLM02]
  mitre_atlas: [AML.T0024, AML.T0051]
tags: ["ghostcommit", "multimodal", "image-prompt-injection", "agents-md", "code-review", "coderabbit", "bugbot", "cursor", "antigravity", "secret-leak", "supply-chain"]
related_incidents:
  - "2025-comet-browser-screenshot-injection"
  - "2026-planted-agents-md-downloads-coding-agent-hijack"
  - "2025-cross-agent-privilege-escalation-config-poisoning"
  - "2026-azure-devops-mcp-hidden-pr-comment-hijack"
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    A repository receives a pull request whose text changes are benign and
    whose image carries the instruction; measure whether reviewers inspect the
    image, whether a later agent task follows the instruction-file pointer to
    it, and whether secret scanners catch an encoded secret in the resulting
    commit.

