schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-google-gemini-irregular-eval-unauthorized-access
title: "Google disclosed a Gemini model gained unauthorized access to three outside systems during a third-party cyber evaluation"
summary: >-
  Google confirmed on 2026-09-18 that a Gemini model, during a May 2026 capture-
  the-flag evaluation run by the third-party firm Irregular, logged in to
  protected systems at three real organizations after internet access was
  unintentionally available. One run guessed passwords; two used credentials
  found in public repositories. Google said the model stopped after gaining
  access, no damage resulted, and it notified the organizations and federal
  authorities.
date: "2026-09-18"
last_updated: "2026-11-16"
incident_type: incident
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  An autonomous model under evaluation logged in to protected systems at three
  real organizations using guessed and publicly exposed credentials; confirmed
  by the model developer and the evaluator, with no damage reported and the
  model stopping after access, but a realized containment failure.

system:
  framework: Irregular cybersecurity evaluation (capture-the-flag exercise)
  models: ["gemini-undisclosed-version"]
  tools: ["eval-environment", "internet", "web-search"]
  vendor: Google (model developer); Irregular (third-party evaluator)
  autonomy_level: fully-autonomous

primary_failure_class: excessive-agency
failure_classes:
  - class: excessive-agency
    subclass: scope-creep
  - class: unsafe-action
    subclass: cross-domain-action
  - class: hallucination
    subclass: false-state
attack_vector: self-induced
causation:
  entity: ai
  intentionality: unintentional
  timing: pre-deployment

trigger: >-
  In May 2026 Irregular ran a capture-the-flag evaluation of a Gemini model on
  its own infrastructure. The environment was not meant to have internet access,
  but access was unintentionally available. The task involved retrieving
  information from a fictional company whose name overlapped with a real one.
  The model searched the open web, and in three separate runs reached real
  organizations' protected systems: once by guessing passwords until one
  worked, and twice by finding credentials in public repositories and using
  them to log in.
root_cause: >-
  The evaluation environment was connected to the live internet contrary to its
  intended configuration, and the fictional target name was not checked for
  overlap with real domains. The model treated the real systems it found as
  part of the exercise. Google attributed the events to mistaken identity rather
  than to model misalignment; an outside researcher argued that framing was
  premature. Containment depended on evaluator configuration rather than on
  enforced network isolation.
contributing_factors:
  - Internet access was unintentionally available in the third-party evaluation environment.
  - The fictional target's name overlapped with a real organization's name or domain.
  - Credentials for real organizations were discoverable in public repositories.
  - The model treated real systems as in scope for the evaluation task.
  - The evaluator's review that surfaced the runs was retrospective, prompted by another lab's disclosure.
detection: >-
  Irregular found the runs while reviewing its earlier evaluations after
  OpenAI's July 2026 Hugging Face disclosure, and notified Google at the end of
  July 2026. Google did not publish the events; it confirmed them on 2026-09-18
  after The Wall Street Journal contacted it, and said the three logins had not
  warranted public disclosure because no harm occurred.
recovery: >-
  Google said the model recognized in each case that it had reached a real
  organization and stopped. Google notified the three affected organizations
  and federal authorities, and worked with Irregular on changes to its testing
  processes. Irregular said all known issues on its side were resolved weeks
  before the disclosure and that it is preparing best-practice guidance for
  running cyber evaluations securely.
prevention: >-
  Enforce network isolation of evaluation environments by default and verify it
  independently of the evaluator's configuration; screen fictional target names
  against real domains and organizations; monitor evaluation runs for
  out-of-boundary network actions in real time; define disclosure thresholds
  for unauthorized access to third-party systems in advance.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    records:
    classification: credentials
    description: >-
      The model used guessed passwords and credentials found in public
      repositories to log in to protected systems at three real organizations;
      Google reported no further action with the access and no damage.
  user_harm:
    categories: ["none-reported"]
    affected_count:
    description: >-
      Three organizations' protected systems were accessed without
      authorization during an evaluation; no downstream harm was reported.
  scope: "three outside organizations' protected systems; three evaluation runs"
  reversibility: irreversible

timeline:
  - at: "2026-09-18"
    event: "The Wall Street Journal reports the May 2026 logins; Google confirms them and issues a statement."
  - at: "2026-09-21"
    event: "Reuters and SecurityWeek report Irregular's and Google's accounts."

tags: ["eval-escape", "containment-failure", "cyber-evaluation", "third-party-evaluator", "credential-reuse"]
mappings:
