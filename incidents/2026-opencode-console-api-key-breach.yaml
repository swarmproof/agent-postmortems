machine_export:
  replayable: true
  stampede_scenario_hint: >-
    A hosted agent console stores users' provider API keys; measure how much
    unauthorized provider spend accrues between key theft and the first owner
    spend alert when keys carry no per-key cap.
  costbomb_seed_hint: >-
    Stolen provider API keys from a shared console are driven at high request
    volume against several LLM providers overnight; measure time-to-detect and
    the effect of per-key spend limits and short key lifetimes.

