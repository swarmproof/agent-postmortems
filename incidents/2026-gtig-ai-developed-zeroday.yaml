schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-gtig-ai-developed-zeroday
title: "Google GTIG reported the first real-world case of criminals using AI to discover and weaponize a zero-day"
summary: >-
  Google's Threat Intelligence Group documented what it assessed as the first
  real-world case of a criminal operation using an AI model to both discover a
  zero-day vulnerability — a two-factor-authentication bypass in a popular
  open-source web administration platform — and help turn it into a working
  exploit for a planned mass-exploitation campaign. Google worked with the vendor
  to patch it before the campaign gained traction.
date: "2026-05-11"
incident_type: incident
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  First documented AI-developed, weaponized zero-day in a planned mass-exploitation
  campaign — a significant offensive-capability milestone — though the campaign was
  disrupted by an early patch before widespread exploitation.

system:
  framework: AI model used by a criminal operation for vulnerability discovery and exploit development
  models: []
  tools: []
  vendor: unattributed criminal operators
  autonomy_level: unknown

primary_failure_class: autonomous-misuse
failure_classes:
  - class: autonomous-misuse
    subclass: cyber-ops
attack_vector: n-a
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  Operators planning a large-scale intrusion campaign used an AI model to identify
  a two-factor-authentication bypass in a widely used open-source web-based
  administration platform and to help develop it into a usable exploit.
root_cause: >-
  General AI capability for code and vulnerability analysis was applied to
  offensive ends — discovering and weaponizing a previously unknown flaw —
  lowering the effort required to produce a working zero-day exploit at scale.
contributing_factors:
  - AI models can accelerate vulnerability discovery and exploit development for capable operators.
  - A widely deployed open-source platform provided a high-value mass-exploitation target.
  - Related activity was observed (North Korean APT45 using AI for bulk exploit checks; state-linked operators experimenting with AI vulnerability hunting).
detection: >-
  Identified and reported by Google's Threat Intelligence Group (GTIG) on
  2026-05-11; Google stated neither Gemini nor Anthropic's Mythos was involved.
recovery: >-
  Google worked with the affected vendor to quietly patch the vulnerability before
  the campaign could properly begin, which it assessed as disrupting the operation.
prevention: >-
  Treat AI-accelerated vulnerability discovery as part of the threat model;
  prioritise rapid patching of widely used platforms; enforce provider usage
  policies and abuse detection against offensive-security misuse of AI models.

