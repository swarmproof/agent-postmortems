machine_export:
  replayable: true
  stampede_scenario_hint: >-
    Stolen long-lived developer tokens satisfy every gate in a release pipeline,
    including a two-person approval, and publish a package whose payload runs at
    interpreter startup under default registry tags; measure how quickly stolen
    cloud credentials harvested from CI runners and cluster nodes are reused and
    how many unpinned deployments pull the compromised default tag.
  costbomb_seed_hint: >-
    Harvested cloud instance-role and AI-provider keys were used for model
    enumeration within hours, the precursor to unauthorized inference spend
    against the victim's accounts.

