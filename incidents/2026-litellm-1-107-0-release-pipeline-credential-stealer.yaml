schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-litellm-1-107-0-release-pipeline-credential-stealer
title: "Hijacked LiteLLM release pipeline published 1.107.0 to PyPI and Docker registries with a credential stealer that ran at every Python startup"
summary: >-
  On 2026-10-21 an attacker holding stolen developer GitHub credentials altered
  LiteLLM's release workflow to build from a lookalike repository, publishing
  litellm 1.107.0 to PyPI and the official Docker and GHCR images. The wheels
  carried startup files that ran a credential stealer on every Python
  interpreter launch and an hourly remote-code loader. PyPI removed the release
  after about 104 minutes; Wiz observed stolen cloud credentials in use within
  about 4.5 hours.
date: "2026-10-21"
last_updated: "2026-11-16"
incident_type: incident
status: factual
confidence: confirmed
severity: critical
severity_rationale: >-
  A credential stealer reached the default install path of a widely used AI
  gateway through its official PyPI release and Docker "latest" tags, executed
  on any Python startup, and harvested cloud, AI-provider, browser and proxy
  database credentials; Wiz recorded roughly 49,000 downloads and observed
  stolen AWS instance-role credentials being used from outside victim
  infrastructure within hours, so harm was realized beyond exposure.

system:
  framework: LiteLLM (AI gateway / LLM proxy); GitHub Actions release pipeline
  models: []
  tools: ["pypi", "docker-hub", "ghcr", "github-actions", "aws", "kubernetes"]
  vendor: BerriAI (LiteLLM)
  autonomy_level: unknown

primary_failure_class: supply-chain-compromise
failure_classes:
  - class: supply-chain-compromise
    subclass: dependency
  - class: insecure-output
    subclass: secret-exposure
  - class: data-exfiltration
    subclass: via-tool
attack_vector: supply-chain
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  On 2026-10-21 an attacker holding three developers' GitHub CLI credentials,
  one belonging to an organization owner, overrode branch protection on the
  private release workflow and pointed the build at a hyphenated lookalike of
  the LiteLLM repository. One stolen credential started the release run and a
  second satisfied the production approval gate. Seven litellm 1.107.0 wheels
  reached PyPI at 11:39 UTC and the container jobs pushed compromised images to
  Docker Hub and GHCR under the version tag and the latest, main-latest and
  main-stable tags. A third credential was then used to delete the workflow
  run records. Installing the wheel or running the image placed files in the
  Python site-packages root that executed at every interpreter start, so no
  import of litellm was required and investigating with pip or Python re-ran
  the payload.
root_cause: >-
  Static, long-lived developer credentials with release authority were
  obtainable from outside the release pipeline, and once held they satisfied
  every control in it: branch protection, the staging-to-production approval
  gate and artifact signing. LiteLLM's disclosure says the credentials are
  believed to have been pulled from logs of an internal LiteLLM deployment
  exposed to the public internet, where an unexpected user account was found;
  it notes that Claude Code can embed a user's GitHub CLI OAuth token in a
  response body, which a proxy that logs response bodies then stores. StepSecurity
  reports the attacker had been inside for about 11 days, with CI runs on
  2026-10-10 and 2026-10-12 sending repository secrets to an outside endpoint.
  The hardening added after the March 2026 compromise (trusted publishing,
  signed images, pinned dependencies) did not apply because the attacker
  changed the pipeline itself rather than injecting a dependency into it.
contributing_factors:
  - Developer GitHub CLI OAuth tokens were long-lived and carried organization-owner and release-approval authority.
  - An internal LiteLLM proxy deployment was reachable from the internet and logged response bodies that could contain coding-agent OAuth tokens.
  - A leaked key was not revoked, allowing the attacker roughly 11 days of access before the release.
  - The approval gate accepted a second stolen human credential, so two-person release control was satisfied by one actor.
  - Startup-file execution in site-packages ran the payload on any Python process, including investigation commands.
  - The latest and main-stable Docker tags were repointed, so unpinned deployments pulled the compromised image.
detection: >-
  Several application-security vendors flagged the release within minutes of
  publication; Wiz, Socket, StepSecurity and Endor Labs published analyses the
  same day. PyPI quarantined and removed 1.107.0 at 13:23 UTC. Wiz observed
  stolen AWS instance-role credentials from CI runners and Kubernetes nodes
  being validated and used for model enumeration from two external addresses
  between 16:20 and 17:01 UTC, about 4.5 hours after exfiltration.
recovery: >-
  LiteLLM restored the release workflow by 12:24 UTC, PyPI removed the package
  at 13:23, GHCR tags were unavailable by 13:51 and Docker Hub tags were
  removed or repointed by 14:20. Maintainer credentials were revoked, the
  image signing key was rotated on 2026-10-23, keyless cosign signing was
  adopted from 2026-11-15, and clean releases resumed 2026-10-24. Users were
  told to pin 1.106.2 or earlier, treat any host that installed 1.107.0 or
  pulled an affected image on 2026-10-21 as fully compromised, stop the
  detached loader, rebuild rather than repair, rotate instance roles, proxy
  database provider keys, master and virtual keys and environment secrets, and
  review cloud audit logs for use of instance credentials from outside their
  infrastructure. The private enterprise registry was not affected.
prevention: >-
  Replace long-lived personal release tokens with short-lived workload
  identities; require hardware-backed or out-of-band approval that a stolen
  token cannot satisfy; prevent coding-agent and proxy logs from retaining
  OAuth tokens in response bodies; alert on CI egress of repository secrets;
  keep internal AI-gateway deployments off the public internet; and scan
  published wheels and images for startup-time execution hooks before
  promotion to default tags.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    records:
    classification: credentials
    description: >-
      The stealer targeted browser credentials and cookies, AWS, GCP and Azure
      credentials including instance metadata, Kubernetes and Docker secrets,
      AI-provider API keys, Git, npm, PyPI and CI secrets, SSH and GPG keys,
      shell history, environment variables of running processes, coding-tool
      credentials, and the upstream provider keys stored in the LiteLLM proxy
      database. Data was encrypted and sent to a domain impersonating LiteLLM.
  user_harm:
    categories: ["economic"]
    affected_count:
    description: >-
      Credential exposure on developer hosts, CI runners, Kubernetes nodes and
      container deployments that installed 1.107.0 or pulled affected tags
      during the window; Wiz reports about 49,000 downloads and confirmed
      post-exfiltration use of stolen cloud credentials.
  scope: "litellm 1.107.0 on PyPI (live ~104 minutes) and Docker Hub/GHCR tags including latest (live ~2.5 hours) on 2026-10-21; ~49,000 downloads"
  reversibility: irreversible

timeline:
  - at: "2026-10-10"
    event: "CI runs begin sending repository secrets to an outside endpoint, per StepSecurity's reconstruction."
  - at: "2026-10-21"
    event: "Release workflow altered at 10:08 UTC; 1.107.0 wheels on PyPI at 11:39; images pushed at 11:46; PyPI removal at 13:23; Docker Hub tags cleaned by 14:20; stolen AWS credentials used externally from 16:20."
  - at: "2026-10-22"
    event: "LiteLLM publishes its incident disclosure; BleepingComputer and others report the compromise."
  - at: "2026-10-23"
    event: "LiteLLM rotates the image signing key and updates the disclosure, noting some earlier assumptions were inaccurate."
  - at: "2026-10-24"
    event: "Clean releases resume."
  - at: "2026-11-15"
    event: "LiteLLM moves to keyless cosign signing from v1.111.0-dev.3."

