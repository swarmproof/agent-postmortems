schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-manus-encoded-email-injection-sandbox-credentials
title: "An encoded instruction in one email made the Manus agent run attacker code in its sandbox before its guardrail asked for approval"
summary: >-
  Salt Labs showed that when a user asked the Manus agent to check their Gmail
  inbox, an attacker-authored email containing obfuscated instructions caused
  the agent to decode and execute them in the user's cloud sandbox. A plain
  command in email was stopped and sent for approval; the encoded form was
  executed first and flagged afterwards. The sandbox held the user's Gmail
  OAuth token and credentials for other connected services such as Google Drive
  and GitHub. The flaw has since been resolved.
date: "2026-10-01"
incident_type: hazard
status: factual
confidence: corroborated
severity: high
severity_rationale: >-
  Zero-click from the victim's perspective beyond a routine inbox check, with
  code execution and reach into connected email, storage and code accounts.
  Researcher test accounts only; fixed; no victims reported.

system:
  framework: Manus (agentic task platform with cloud sandbox and account integrations)
  models: []
  tools: ["gmail", "code-execution-sandbox", "google-drive", "github"]
  vendor: Manus
  autonomy_level: supervised-autonomous

primary_failure_class: prompt-injection
failure_classes:
  - class: prompt-injection
    subclass: indirect
  - class: jailbreak
    subclass: obfuscation
  - class: excessive-agency
    subclass: missing-approval-gate
  - class: data-exfiltration
    subclass: via-tool
attack_vector: untrusted-content
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  The victim's only action was asking Manus to check their inbox. An email sent
  by the attacker carried instructions in an obfuscated encoding. The agent
  treated the email body as instructions rather than data, decoded the content
  and ran it in the sandbox, which produced attacker-controlled command
  execution in that environment.
root_cause: >-
  Email content was processed as instructions, and the guardrail that
  intercepts dangerous commands evaluated the text it could recognise rather
  than the action about to execute. For plainly written commands it stopped and
  asked for approval; for the encoded form, the decoding step itself performed
  the execution, so the approval prompt arrived after the fact. Credentials for
  connected services were present inside the same sandbox, so code execution
  there reached the user's accounts.
contributing_factors:
  - Email content from arbitrary senders reached the agent as instructions.
  - Guardrail detection keyed on recognisable command text, which encoding defeated.
  - Human approval was requested after execution rather than before it.
  - OAuth tokens and connected-service credentials were available inside the code-execution sandbox.
detection: >-
  Demonstrated by Salt Labs on its own test accounts. Salt reported receiving no
  response from Manus and submitted the finding through Meta's bug bounty
  programme. Salt published its write-up and press release on 2026-10-01, with
  coverage by Dark Reading and TechRadar.
recovery: >-
  Salt Labs states the flaw has since been resolved and the attack can no
  longer be reproduced. No statements from Manus or Meta appear in the Salt
  write-up.
prevention: >-
  Treat inbox and other retrieved content as data, never as instructions;
  evaluate approval gates on the resolved action, not on the surface text;
  require approval before any decoding-and-execute step; keep account tokens
  out of the environment where untrusted code runs and scope them narrowly.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    classification: credentials
    description: >-
      The sandbox exposed the user's Gmail OAuth token and credentials for
      other connected services, giving access to email, storage and code
      repositories. Researcher test accounts only.
  user_harm:
    categories: ["none-reported"]
    description: >-
      Proof of concept against the researchers' own accounts; no victims
      reported.
  scope: "Manus users with connected accounts prior to the fix"
  reversibility: reversible

timeline:
  - at: "2026-10-01"
    event: "Salt Labs publishes the research and press release; flaw reported as already resolved."

mappings:
  owasp_llm: [LLM01, LLM02, LLM06]
  owasp_agentic: [T3]
  mitre_atlas: [AML.T0024, AML.T0051, AML.T0054]
related_incidents:
