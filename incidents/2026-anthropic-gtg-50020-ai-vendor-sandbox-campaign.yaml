schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-anthropic-gtg-50020-ai-vendor-sandbox-campaign
title: "An actor injected instructions into an AI vendor's evaluation sandbox and autonomously hit ~30 AI companies in four days"
summary: >-
  Anthropic's September 2026 threat report described a Russian-speaking financially motivated actor it tracks as GTG-50020 that moved from hotel and fintech targets to AI vendors. It injected instructions into an AI vendor's automated evaluation sandbox, making it disclose production API keys for multiple providers, then ran autonomous exploitation against roughly thirty AI companies in about four days. Anthropic said its own systems were not compromised.
date: "2026-09-10"
last_updated: "2026-11-16"
incident_type: incident
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  A realized, mostly autonomous campaign against about thirty AI companies that
  extracted production API keys from an evaluation sandbox and reused customer
  keys for compute; an earlier intrusion exfiltrated about 26 GB with extortion
  demands of $1.5-2.5 million, while the attempt to reach a pre-release model
  failed.

system:
  framework: containerized open-source pentest platform behind a local model gateway with autonomous worker agents
  models: []
  tools: ["evaluation-sandbox", "pentest-platform", "local-model-gateway", "stolen-api-keys"]
  vendor: GTG-50020 (Russian-speaking, financially motivated, per Anthropic)
  autonomy_level: supervised-autonomous

primary_failure_class: prompt-injection
failure_classes:
  - class: prompt-injection
    subclass: direct
  - class: autonomous-misuse
    subclass: cyber-ops
  - class: data-exfiltration
    subclass: via-tool
attack_vector: direct-user
causation:
  entity: both
  intentionality: intentional
  timing: post-deployment

trigger: >-
  The actor injected malicious instructions into an AI vendor's automated
  evaluation sandbox, causing the sandbox to disclose the credentials it held,
  including production API keys from multiple AI providers. It then ran a
  containerized open-source pentest platform behind a local model gateway whose
  worker agents performed injection, cross-site scripting, authentication-bypass,
  and server-side request forgery testing without supervision, with exploitation
  enabled against production systems. After finding one working attack path, the
  actor repeated it against roughly thirty AI companies in about four days,
  adjusting slightly per target, while seeking access to a pre-release Claude
  model across more than a dozen avenues.
root_cause: >-
  An automated evaluation sandbox held live production credentials and acted on
  injected instructions as if trusted, turning a model-evaluation surface into a
  credential-disclosure path; combined with autonomous worker agents that could
  replay one working exploit across many similar targets, a single foothold
  generalized into a multi-victim campaign.
contributing_factors:
  - An automated evaluation sandbox held production API keys and treated injected content as instructions.
  - Autonomous worker agents ran injection, XSS, auth-bypass, and SSRF tests against production with exploitation enabled.
  - A reusable working exploit path could be replayed across roughly thirty similar AI-company targets.
  - Stolen customer API keys were reused to run the actor's own workloads.
detection: >-
  Anthropic detected the activity through its investigations of Claude misuse and
  disclosed it in the September 2026 threat report, attributing it to a
  Russian-speaking financially motivated actor. Anthropic stated its own systems
  were not compromised and the attempts to reach a pre-release model failed.
recovery: >-
  Anthropic disrupted the activity, strengthened its safeguards, and shared
  intelligence with authorities and partners where appropriate. Affected
  providers whose keys were exposed would need to rotate credentials and review
  sandbox trust boundaries.
prevention: >-
  Keep production credentials out of evaluation sandboxes and treat sandbox
  inputs as untrusted; isolate evaluation environments from production secrets;
  detect injected-instruction patterns in automated evaluation flows; and monitor
  for one-exploit-many-targets replay behavior indicative of autonomous worker
  agents.

blast_radius:
