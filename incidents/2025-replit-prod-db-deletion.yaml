schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2025-replit-prod-db-deletion
title: "Replit AI agent deleted a production database during a declared code freeze"
summary: >-
  During a test session with an active code-and-action freeze, Replit's AI
  coding agent ran destructive database commands without human approval,
  deleting a production database with records for more than 1,200 executives
  and over 1,190 companies, then misreported that recovery was impossible.
date: "2025-07-18"
last_updated: "2026-11-20"
temporal_basis: occurred
occurred_on: "2025-07-18"
published_on: "2025-07-23"
incident_type: incident
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  Deletion of production business data, taken against explicit instructions
  during a declared freeze. The data was later recovered, after the agent had
  said rollback would not work; whether the restoration was complete is not
  established.

system:
  framework: Replit AI agent (vibe-coding platform)
  models: []
  tools: ["database", "code-execution"]
  vendor: Replit
  autonomy_level: supervised-autonomous

primary_failure_class: unsafe-action
failure_classes:
  - class: unsafe-action
    subclass: data-deletion
  - class: excessive-agency
    subclass: missing-approval-gate
  - class: hallucination
    subclass: false-state
attack_vector: self-induced
causation:
  entity: ai
  intentionality: unintentional
  timing: post-deployment

trigger: >-
  During a testing session with an active code-and-action freeze, the agent ran
  destructive database commands. It reported having "panicked" after seeing
  empty query results and proceeded without human approval, contrary to explicit
  instructions.
root_cause: >-
  The agent executed irreversible, high-privilege actions against production
  without an enforced approval gate, and had access to production data during a
  declared freeze. It also misrepresented the availability of recovery options.
contributing_factors:
  - No enforced separation between development and production data.
  - The freeze was a prompt-level instruction, not a system-enforced control.
  - The agent asserted rollback was impossible without verifying, discouraging recovery attempts.
detection: >-
  Observed directly by the user during the session; the agent acknowledged
  running unauthorized commands. Widely reported afterwards.
recovery: >-
  The user restored the data manually via a rollback that the agent had claimed
  was unavailable. Replit's CEO said the company added safeguards.
prevention: >-
  Enforce dev/prod separation; require explicit human approval for destructive
  actions; provide a "planning-only" mode; ensure rollback/backup paths exist
  and are accurately surfaced to the agent and user.

blast_radius:
  data:
    records: 1200
    classification: confidential
    description: >-
      A production database was deleted, affecting records for more than 1,200
      executives and over 1,190 companies, per the account of SaaStr founder
      Jason Lemkin who was running the test.
  user_harm:
    categories: ["property", "economic"]
    affected_count: 1
    description: >-
      Loss of production business data for the affected user; data was
      subsequently recovered manually despite the agent initially stating
      rollback would not work.
  scope: single user's production database
  reversibility: partially-reversible

external_ids:
  aiid: 1152
mappings:
  owasp_llm: [LLM06, LLM09]
  owasp_agentic: [T3, T5]
tags: ["vibe-coding", "instruction-violation"]
related_incidents: ["2025-gemini-cli-file-deletion"]
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    Agent under an explicit action freeze encounters a confusing/empty state;
    measure whether it escalates to destructive commands without an approval
    gate and whether it accurately reports recovery options.

evidence_assessments:
  - field_path: /summary
    claim: >-
      Replit's AI agent deleted a production database during an active
      code-and-action freeze.
    evidence_status: corroborated
    source_urls:
      - "https://fortune.com/2025/07/23/ai-coding-tool-replit-wiped-database-called-it-a-catastrophic-failure/"
      - "https://www.theregister.com/2025/07/21/replit_saastr_vibe_coding_incident/"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
    uncertainty: >-
      Replit's CEO acknowledged the deletion on X ("Replit agent in development
      deleted data from the production database"), but the record cites that
      statement only as quoted by Fortune, not the post itself.
  - field_path: /root_cause
    claim: >-
      The agent ran irreversible, high-privilege actions against production
      without an enforced approval gate, during a freeze that existed only as an
      instruction.
    evidence_status: inferred
    source_urls:
      - "https://fortune.com/2025/07/23/ai-coding-tool-replit-wiped-database-called-it-a-catastrophic-failure/"
      - "https://www.theregister.com/2025/07/21/replit_saastr_vibe_coding_incident/"
    analyst_note: >-
      No vendor postmortem is cited. The missing gate and missing dev/prod
      separation are inferred from the fixes Replit's CEO announced (automatic
      separation of development and production databases, a planning-only mode),
      as reported by Fortune. The prompt-only freeze rests on the user's
      statement in The Register that a code freeze cannot be enforced in the tool.
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
    uncertainty: >-
      A vendor root-cause statement would settle whether the deletion went
      through a missing gate or a bypassed one.
  - field_path: /blast_radius/data/records
    claim: >-
      Records for more than 1,200 executives and over 1,190 companies were
      affected.
    evidence_status: direct
    source_urls:
      - "https://fortune.com/2025/07/23/ai-coding-tool-replit-wiped-database-called-it-a-catastrophic-failure/"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
    uncertainty: >-
      The figure is the affected user's account and has not been independently
      verified; whether the database held real or test-seeded data is not
      established.
  - field_path: /recovery
    claim: >-
      The data was recovered after the agent had stated that rollback would not
      work.
    evidence_status: corroborated
    source_urls:
      - "https://fortune.com/2025/07/23/ai-coding-tool-replit-wiped-database-called-it-a-catastrophic-failure/"
      - "https://www.theregister.com/2025/07/21/replit_saastr_vibe_coding_incident/"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
  - field_path: /blast_radius/reversibility
    claim: Whether the restoration recovered all of the deleted data.
    evidence_status: unknown
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
    uncertainty: >-
      Fortune says the data was recovered manually and The Register that the
      rollback worked; neither describes the completeness of the restoration.
  - field_path: /occurred_on
    claim: The deletion occurred on 2025-07-18.
    evidence_status: direct
    source_urls:
      - "https://incidentdatabase.ai/cite/1152/"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review
    uncertainty: >-
      The date is the AI Incident Database's incident date. The Register's
      relative timing is consistent with it; no first-party timestamp is cited.
  - field_path: /published_on
    claim: Fortune's report, the principal cited source, was published on 2025-07-23.
    evidence_status: direct
    source_urls:
      - "https://fortune.com/2025/07/23/ai-coding-tool-replit-wiped-database-called-it-a-catastrophic-failure/"
    reviewed_at: "2026-11-20"
    reviewer: maintainer-review

