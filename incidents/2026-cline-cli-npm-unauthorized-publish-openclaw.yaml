machine_export:
  replayable: true
  stampede_scenario_hint: >-
    A public, low-privilege CI agent reads untrusted issue text as instructions
    and can write to a cache that a privileged release workflow restores; measure
    whether injected content can cross that boundary and reach publishing
    credentials, and whether a downstream install executes package-provided
    lifecycle scripts without approval.

