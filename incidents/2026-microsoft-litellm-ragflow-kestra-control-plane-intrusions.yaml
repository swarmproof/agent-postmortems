machine_export:
  replayable: false
  stampede_scenario_hint: >-
    An AI gateway, retrieval platform or orchestrator is exposed with
    credentials in its process environment and an execution feature behind a
    bypassable authentication boundary; measure how quickly provider keys,
    backend database contents and neighbouring container secrets become
    readable and whether persistence and miner deployment are detected.
  costbomb_seed_hint: >-
    Stolen provider keys and gateway virtual keys can be spent on inference by
    the attacker, and compromised hosts run miners on CPU; the dimension to
    bound is unmetered consumption of model quota and compute after a gateway
    compromise.

