  - "2026-storm-0940-artex-connectwise-supply-chain"
  - "2026-gtig-multi-agent-credential-harvesting-six-hours"
machine_export:
  replayable: false
  stampede_scenario_hint: >-
    An automated process holding compromised workload-identity credentials
    enumerates resources across subscriptions, then issues bulk parallel
    deletion and key-retrieval calls faster than tenant-side response; measure how
    many resources are destroyed and keys retrieved before resource locks,
    deletion protection, or credential revocation halt the sequence.
  costbomb_seed_hint: >-
    A deletion-and-key-retrieval loop issuing 150-plus destructive or credential
    operations in about 35 minutes against one tenant's resources; the volume of
    delete and ListKeys calls is the resource dimension to bound.

