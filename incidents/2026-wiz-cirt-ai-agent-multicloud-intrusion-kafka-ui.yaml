machine_export:
  replayable: false
  stampede_scenario_hint: >-
    An attacker-operated agent gains code execution on one exposed workload in a
    multi-cloud estate and begins chaining pod credentials to cloud service accounts,
    organization roles, identity-provider admin and GitOps deploy rights, retrying each
    failed hop within minutes and labeling its artifacts as a pentest; measure whether
    any boundary forces a human approval or whether machine-speed privilege chaining
    reaches org-wide admin unchallenged.
  costbomb_seed_hint: >-
    The agent expanded compute and minted dozens of identities while a single source IP
    scanned more than 600 environments; the resource dimension to bound is unbounded
    identity creation and compute expansion by a compromised deployment account.

