      Members, donors, and staff of political parties and media outlets, and
      individuals tied to a political movement, had personal data exposed through
      a dark-web doxxing platform; records included minors.
  scope: >-
    42 tracked target entities; internal access to at least 14; a doxxing platform
    loaded with tens of millions of rows
  reversibility: irreversible

