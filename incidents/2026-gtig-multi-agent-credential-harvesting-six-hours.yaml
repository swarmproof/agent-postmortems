schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-gtig-multi-agent-credential-harvesting-six-hours
title: "A financially motivated actor built and ran a multi-agent credential-harvesting framework from a victim's cloud in under six hours"
summary: >-
  Google Threat Intelligence Group reported that in Q2 2026 a suspected
  financially motivated actor compromised an organization's cloud infrastructure,
  then used an AI coding chatbot, a prompt, and Markdown agent instructions to
  plan, build, and run a mass credential-harvesting campaign in less than six
  hours. The agents managed the vulnerability-scanning pipeline, troubleshot
  errors, and rotated IP addresses without human intervention, compromising
  thousands of third-party credentials.
date: "2026-09-09"
last_updated: "2026-11-16"
incident_type: incident
status: factual
confidence: corroborated
severity: high
severity_rationale: >-
  Thousands of third-party credentials were compromised in one sub-six-hour run
  launched from a victim's cloud environment; the footholds those credentials
  enabled were not quantified and no victim was named, but a related exposed
  framework held more than 23,800 harvested secrets.

system:
  framework: attacker-built multi-agent framework driven by an AI coding chatbot and Markdown playbooks (tool not named by GTIG)
  models: []
  tools: ["ai-coding-chatbot", "markdown-playbooks", "vulnerability-scanner", "ip-rotation", "victim-cloud-infrastructure"]
  vendor: suspected financially motivated threat actor
  autonomy_level: supervised-autonomous

primary_failure_class: autonomous-misuse
failure_classes:
  - class: autonomous-misuse
    subclass: cyber-ops
  - class: data-exfiltration
    subclass: via-tool
attack_vector: direct-user
causation:
  entity: both
  intentionality: intentional
  timing: post-deployment

trigger: >-
  After compromising an organization's cloud infrastructure, the actor supplied
  an AI coding chatbot with a prompt and a set of preconfigured Markdown
  instruction files that acted as operational playbooks for each campaign stage.
  Within less than six hours the resulting agents planned, built, and executed
  automated scanning and credential harvesting against third-party targets,
  managing the scanning pipeline, performing real-time troubleshooting, and
  executing IP-rotation logic without manual intervention. Running from the
  victim's cloud let the attack traffic originate from legitimate IP addresses.
root_cause: >-
  A compromised cloud environment supplied both compute and trusted egress, and
  a general-purpose coding agent given playbook-style instructions could stand up
  an end-to-end scanning and harvesting pipeline without the engineering time or
  team size such campaigns previously required. The human-in-the-loop latency
  that defenders rely on for a response window was removed.
contributing_factors:
  - The actor already held access to an organization's cloud infrastructure, which hosted the framework and masked its origin.
  - Markdown playbooks let one operator delegate pipeline management, error handling, and IP rotation to the agents.
  - Operating from victim cloud infrastructure routed attack traffic through legitimate IP addresses, reducing detection signal.
  - A separately observed command-and-control server ran a related reconnaissance-and-credential framework, indicating broader reuse of the pattern.
detection: >-
  Mandiant observed the campaign against the compromised cloud environment.
  Separately, GTIG found an exposed command-and-control server hosting an
  automated reconnaissance and credential-management framework, whose directory
  listing exposed agentic configuration and knowledge files and a dashboard
  managing more than 23,800 harvested secrets in real time.
recovery: >-
  Documented and published by GTIG on 2026-09-09 as threat research in its AI
  Threat Tracker. The report frames the activity as an evolution from
  endpoint-focused infostealers toward offensive agentic harvesting and
  recommends defenders prepare for compressed response windows.
prevention: >-
  Detect compromised cloud-workload identities and anomalous egress from cloud
  environments; alert on bulk, machine-speed credential-validation activity;
  constrain what a compromised cloud foothold can reach; and treat
  playbook-driven coding agents as a machine-speed scanning-and-harvesting threat
  requiring automated detection rather than manual review.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    records:
    classification: credentials
    description: >-
      Thousands of third-party credentials were compromised in the sub-six-hour
      campaign. A separately observed reconnaissance-and-credential framework on
      an exposed C2 server managed more than 23,800 harvested secrets, including
      API keys for cloud and AI services.
  user_harm:
    categories: ["economic"]
    affected_count:
    description: >-
      Third parties whose credentials were harvested faced account-compromise
      exposure; the number of downstream intrusions enabled was not quantified.
  scope: >-
    One compromised cloud environment used as the launch point; thousands of
    third-party credentials compromised; a related exposed framework held
    23,800+ secrets
  reversibility: partially-reversible

timeline:
  - at: "2026-05-01"
    event: "GTIG's prior AI Threat Tracker report documents earlier adversarial AI misuse (referenced baseline)."
  - at: "2026-06-30"
    event: "Q2 2026: Mandiant observes the sub-six-hour multi-agent credential-harvesting campaign launched from a compromised cloud environment."
  - at: "2026-09-09"
    event: "GTIG publishes the finding in its AI Threat Tracker."

