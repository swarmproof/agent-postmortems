    description: >-
      Domain-level or interactive access reported at multiple organizations;
      victim data archived and exfiltrated in the broader affiliate activity,
      with several organizations posted to Aurora's leak site.
  user_harm:
    categories: ["economic"]
    description: >-
      Ransomware encryption and extortion against organizations across multiple
      countries and sectors, including manufacturing, food and agriculture, and
      professional services.
  scope: "At least 10 organizations in the agent-assisted set; 20+ organizations across nine countries in the wider affiliate tracking"
  reversibility: irreversible

timeline:
