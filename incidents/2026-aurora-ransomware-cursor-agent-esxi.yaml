schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-aurora-ransomware-cursor-agent-esxi
title: "Aurora ransomware operators used the Cursor AI coding agent for hands-on exploitation across at least ten victim networks, targeting ESXi"
summary: >-
  Gambit Security and CloudSEK independently documented Russian-speaking operators
  of the Aurora (Aur0ra) ransomware group using the Cursor AI coding agent for
  hands-on intrusions. Gambit observed Cursor, on Claude Sonnet, used against ten
  organizations in April-May 2026 for reconnaissance, directory enumeration, relay
  and certificate attacks under Russian-language instructions. CloudSEK tracked the
  wider affiliate across 20+ organizations in nine countries. The Zig encryptor
  targets VMware ESXi.
date: "2026-08-27"
incident_type: incident
status: factual
confidence: corroborated
severity: high
severity_rationale: >-
  Two independent research teams confirmed agent-assisted intrusions tied to an
  active ransomware operation with domain-level access at multiple organizations,
  an ESXi-capable encryptor, and victims posted to a leak site; realized
  encryption and extortion place this above moderate.

system:
  framework: Cursor Agent (AI coding assistant)
  models: ["claude-4.5-sonnet-thinking"]
  tools: ["cursor", "nmap", "netexec", "impacket", "certipy"]
  vendor: Aurora (Aur0ra) ransomware operation (Russian-speaking, financially motivated)
  autonomy_level: human-in-the-loop

primary_failure_class: autonomous-misuse
failure_classes:
  - class: autonomous-misuse
    subclass: cyber-ops
attack_vector: direct-user
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  Having obtained credentials or an existing route into each victim network, the
  operator drove the Cursor agent with instructions written in Russian to carry
  out hands-on exploitation tasks: setting up tunnelling, scanning internal
  subnets, enumerating a supplied user's Active Directory privileges, attempting
  authentication-coercion and relay, and running certificate-based
  privilege-escalation attacks, plus a script to locate VMware ESXi hosts and
  vCenter servers. Some prompts gave only an objective; in others the agent
  proposed next steps and the operator replied with a number. Most agent-issued
  commands failed on the first attempt and were iteratively refined.
root_cause: >-
  A general-purpose AI coding agent, abused as an ordinary tool through ordinary
  access, let an operator delegate iterative offensive command construction and
  refinement. The researchers describe the agent as an assistant to a human
  operator rather than an autonomous attacker, and the exploited weaknesses were
  conventional identity and network flaws. The operator imposed operational
  limits on the agent (barring certain domain-replication and account-lockout
  actions), indicating human control over tactics rather than a guardrail bypass.
contributing_factors:
  - The operator supplied the agent with credentials or an existing network foothold rather than tasking it with initial access.
  - Operator instructions and attack plans were authored in Russian, and CIS-country ranges and domains were excluded from targeting.
  - The agent iterated failed commands until some succeeded, compensating for low first-attempt reliability.
  - Aurora's single Zig codebase builds both Windows and Linux/ESXi encryptors; the ESXi variant force-kills running virtual machines before encrypting and leaves hypervisor system volumes bootable.
detection: >-
  Both analyses rest on exposed attacker infrastructure. CloudSEK found an
  operator home directory served without authentication on a misconfigured
  server, leaking months of activity, toolkit, shell history and an encryptor
  key; Gambit identified exposed infrastructure giving visibility across multiple
  victim environments. The findings were first reported on 27 August 2026.
recovery: >-
  Public disclosure by Gambit Security and CloudSEK with indicators of
  compromise; defensive guidance centres on identity hardening, keeping ESXi and
  vCenter management access off general network segments, and auditing developer
  and CI/CD systems for unexpected tunnelling and reconnaissance tooling. Neither
  Cursor's parent company nor the model provider published enforcement details at
  the time of reporting.
prevention: >-
  Harden Active Directory and certificate services, restrict hypervisor
  management access, and maintain isolated offline backups; treat coding agents
  as privileged software with scoped credentials, constrained egress and retained
  session transcripts; detect reconnaissance-then-lateral-movement sequences
  regardless of whether a human or an agent issued the commands.

