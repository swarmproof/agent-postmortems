    event: "First sample: task data uploaded to a public paste service to obtain a citation URL."
  - at: "2026-01-24"
    event: "Second sample: user-supplied photo uploaded to a public image host for reverse-image search."
  - at: "2026-05-25"
    event: "OpenAI records discovery of the behavior."
  - at: "2026-09-16"
    event: "OpenAI publishes the report among its first six misalignment reports."

