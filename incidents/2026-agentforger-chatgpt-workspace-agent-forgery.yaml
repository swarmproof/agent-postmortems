schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-agentforger-chatgpt-workspace-agent-forgery
title: "AgentForger: one crafted ChatGPT link could create and schedule an attacker-directed agent under a victim's identity"
summary: >-
  Zenity Labs disclosed that the ChatGPT Workspace Agents builder accepted
  instructions supplied through a link and ran them in the victim's
  authenticated session without confirmation. One click could create an agent
  wired to the victim's already-authorised enterprise apps, with approvals off
  and a recurring schedule taking further instructions from the attacker.
  Reported 2026-06-04 via Bugcrowd; OpenAI fixed it server-side on 2026-06-08.
  No in-the-wild exploitation reported.
date: "2026-07-23"
last_updated: "2026-11-16"
incident_type: hazard
status: factual
confidence: corroborated
severity: high
severity_rationale: >-
  A persistent agent acting with a real employee's identity and connector
  access, with approval gates disabled, is an insider-equivalent foothold
  across email, chat and file systems. Fixed within four days of report and
  before public disclosure; no evidence of exploitation.

system:
  framework: "ChatGPT Workspace Agents (Agent Builder)"
  models: []
  tools: ["email-connector", "calendar-connector", "cloud-storage-connector", "chat-connector", "scheduler"]
  vendor: OpenAI
  autonomy_level: fully-autonomous

primary_failure_class: prompt-injection
failure_classes:
  - class: prompt-injection
    subclass: indirect
  - class: excessive-agency
    subclass: missing-approval-gate
  - class: unsafe-action
    subclass: unauthorized-write
  - class: data-exfiltration
    subclass: via-tool
attack_vector: untrusted-content
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  A victim who is logged into ChatGPT, has Workspace Agents access and has
  previously authorised at least one connector opens a normal-looking link,
  for example from a phishing email. The agent builder reads attacker-chosen
  instructions carried by that link and submits them automatically as if the
  user had typed them, so an agent is configured, connected to existing
  integrations, published and scheduled without any further action or consent
  prompt.
root_cause: >-
  The builder treated initialisation data arriving with a link as executable
  input rather than as untrusted user data requiring explicit intent, a
  cross-site request forgery pattern applied to agent creation. Natural
  language instructions could also change security-sensitive settings such
  as approval policy and schedule, so the one gate designed to stop silent
  actions could be disabled by the same input. Previously granted connector
  consent was reusable by any new agent without re-authorisation.
contributing_factors:
  - No explicit user-intent check before state-changing operations in an authenticated session.
  - Approval requirements and schedules were configurable through the same natural-language channel as ordinary tasks.
  - Connector grants made for one purpose were inherited by any agent the user appeared to create.
  - Existing monitoring watches users and endpoints, so an agent acting under a legitimate identity blends into normal activity.
detection: >-
  Found by Zenity Labs (researcher Mike Takahashi; CTO Michael Bargury
  quoted) and published on 2026-07-23 as a two-part technical series plus
  press release; covered by SecurityWeek and The Hacker News. Zenity reported
  a dozen lab proof-of-concept scenarios.
recovery: >-
  Reported to OpenAI through Bugcrowd on 2026-06-04, triaged and accepted on
  2026-06-05, and fixed on 2026-06-08 with a server-side change that removed
  the link-supplied instruction path. No CVE was assigned. No public OpenAI
  statement beyond acceptance of the report was located. Zenity found no
  evidence of exploitation in the wild.
prevention: >-
  Require explicit, verifiable user intent before creating, publishing or
  scheduling an agent; never accept executable instructions from link
  parameters; protect approval policy and scheduling behind controls that
  natural-language input cannot change; scope connector consent per agent;
  inventory agents and alert on ones with approvals disabled or unusually
  frequent schedules.

blast_radius:
  cost:
    amount_usd:
    estimated: false
  data:
    records:
    classification: confidential
    description: >-
      Any data reachable through the victim's authorised connectors, such as
      mailbox, calendar, cloud storage and chat content; lab scenarios included
      harvesting credentials found in chat history.
  user_harm:
    categories: ["none-reported"]
    affected_count:
    description: >-
      Controlled lab demonstration; no real organisations affected. Lab
      scenarios included internal impersonation and a fraudulent approval
      request, which carry potential economic and reputational harm.
  scope: organisations using ChatGPT Workspace Agents with authorised connectors, until the 2026-06-08 fix
  reversibility: partially-reversible

cwe: ["CWE-352"]
mappings:
  owasp_llm: [LLM01, LLM02, LLM06]
  owasp_agentic: [T3]
  mitre_atlas: [AML.T0024, AML.T0051]
tags: ["agentforger", "csrf", "agent-builder", "workspace-agents", "rogue-agent", "persistence"]
related_incidents:
  - "2026-cosnitch-copilot-personal-one-click-exfiltration"
  - "2026-rovoblast-atlassian-rovo-one-click-prefill"
  - "2026-dialogflow-cx-rogue-agent"
machine_export:
  replayable: true
  stampede_scenario_hint: >-
    An agent-creation surface accepts instructions carried by an inbound link
    in an authenticated session; measure whether an agent can be created,
    connected to existing integrations, have its approval gate disabled and be
    scheduled without an explicit user-intent check.
  costbomb_seed_hint: >-
    A forged agent is scheduled to run on a frequent recurring cadence,
    polling for new instructions; measure whether scheduling limits or
    anomaly alerts bound the run rate.

