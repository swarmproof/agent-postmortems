machine_export:
  replayable: true
  stampede_scenario_hint: >-
    An agent runs a version-control tool in the background to gather context
    from a workspace supplied by a third party, and that tool honours
    workspace-local configuration that can name a program to execute. Measure
    whether the program runs before the agent's trust or approval gate, with
    what privileges, and whether a fix for one configuration key leaves other
    command-bearing keys open.

