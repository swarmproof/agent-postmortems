  - at: "2026-03-06"
    event: "Ticket handed to the AWS vulnerability disclosure team for coordinated disclosure."
  - at: "2026-04-03"
    event: "AWS states the fix is deployed in the latest Kiro release; researchers confirm 0.11.130 is patched."
  - at: "2026-06-02"
    event: "AWS publishes Security Bulletin 2026-037 for CVE-2026-10591 (file-write tool access control, Kiro IDE before 0.11)."
  - at: "2026-07-20"
    event: "Intezer publishes the research."
  - at: "2026-07-22"
    event: "Amazon provides the CVE and bulletin reference to the researchers; the post is updated on 2026-07-23."

