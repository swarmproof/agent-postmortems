schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-kiro-hidden-web-text-mcp-config-rce
title: "AWS Kiro IDE rewrote its own MCP server configuration from hidden web-page text, reaching code execution (CVE-2026-10591)"
summary: >-
  Intezer and Kodem Security showed that text invisible to a human reader on a
  web page Kiro was asked to fetch could direct the agent to write its own MCP
  server configuration file, which was not a protected path and needed no
  approval. Kiro reloaded the configuration automatically and started the newly
  registered server, running attacker-chosen code with the user's privileges.
  AWS fixed the file-write tool's path restrictions and associated the report
  with CVE-2026-10591.
date: "2026-07-20"
last_updated: "2026-11-16"
incident_type: hazard
status: factual
confidence: confirmed
severity: high
severity_rationale: >-
  Arbitrary code execution on a developer workstation from a single approved
  web fetch, with the human-approval boundary bypassed, in a vendor-shipped
  agentic IDE; vendor-confirmed with a CVE (CVSS 3.1 8.8 per vulnerability
  databases). Researcher demonstration; patched before publication; no
  in-the-wild exploitation reported.

system:
  framework: "Kiro IDE (AWS agentic IDE)"
  models: []
  tools: ["web-fetch", "file-write", "mcp"]
  vendor: Amazon Web Services
  autonomy_level: supervised-autonomous

primary_failure_class: prompt-injection
failure_classes:
  - class: prompt-injection
    subclass: indirect
  - class: excessive-agency
    subclass: missing-approval-gate
  - class: unsafe-action
    subclass: unauthorized-write
attack_vector: untrusted-content
causation:
  entity: human
  intentionality: intentional
  timing: post-deployment

trigger: >-
  A user asks Kiro to fetch and act on a web page and approves only the fetch,
  which is the expected interaction. The page carries instructions in text that
  a human reader does not see. The model treats that text as instructions and
  uses its file-writing tool to change Kiro's MCP server configuration, a path
  the tool did not protect, so no approval is requested for the write. Kiro
  reloads the configuration automatically, starting the newly registered server
  and executing attacker-chosen code with the user's privileges. The researchers
  observed that Kiro sometimes displayed a warning about the configuration
  change, but the reload proceeded regardless of the user's response.
root_cause: >-
  The agent could edit the file that defines what code it is allowed to run.
  The MCP configuration file was outside the file-write tool's protected paths,
  configuration changes were applied by automatic reload rather than by an
  explicit user action, and content retrieved from an untrusted web page was
  given the same authority as user instructions. Together these let a single
  fetch escalate past the human-approval step to code execution.
contributing_factors:
  - The MCP server configuration file was not in the protected-paths list, so the agent could write it without a prompt.
  - Configuration reload was automatic, and any warning shown did not block the reload.
  - Hidden page text was processed as instructions with the same authority as the user's request.
  - AWS's bulletin frames the fix as path restrictions on the file-write tool for execution-sensitive files, of which the MCP configuration is one instance.
detection: >-
  Found by Nicole Fishbein (Intezer Research) with Eran Segal (Kodem Security)
  and reported through HackerOne on 2026-02-11; the ticket moved to the AWS
  vulnerability disclosure team on 2026-03-06. Published on 2026-07-20 and
  updated on 2026-07-23 with the CVE. Cyber Security News reported the finding
  independently on 2026-07-22.
recovery: >-
  AWS told the researchers on 2026-04-03 that the fix was in the latest Kiro
  release; the researchers confirmed the behaviour patched in Kiro IDE
  0.11.130. AWS Security Bulletin 2026-037 (published 2026-06-02) and
  CVE-2026-10591 describe insufficient access control in the file-write tool in
  Kiro IDE before version 0.11, fixed in 0.11, with no workaround; the bulletin's
  example path is an editor task file rather than the MCP configuration, and AWS
  told the researchers the report was covered by that CVE. Independent reporting
  states 0.11.34 was the first build to add the MCP configuration file to the
  protected-paths list.
prevention: >-
  Place every file that governs what code the agent may execute, including MCP
  server registries, task runners and approval allowlists, behind a protected
  path that the agent cannot write from a tool call; require explicit user
  confirmation before applying configuration changes rather than auto-reloading;
  treat fetched web content as untrusted data; and keep a human approval on the
  action that starts a new executable, not only on the fetch that preceded it.

blast_radius:
  cost:
    amount_usd: null
    estimated: false
  data:
    classification: unknown
    description: >-
      The proof of concept collected host identity details to demonstrate
      execution; the researchers state the same path could reach credentials and
      source code. No real data exposure was reported.
  user_harm:
    categories: ["none-reported"]
    description: >-
      Researcher proof of concept, patched before publication; no in-the-wild
      exploitation reported.
  scope: "Kiro IDE installs before the fixed release (versions prior to 0.11 per the AWS bulletin; the researchers tested 0.9.2 and 0.10.16)"
  reversibility: partially-reversible

