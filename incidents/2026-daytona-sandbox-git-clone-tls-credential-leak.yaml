  stampede_scenario_hint: >-
    An agent runtime injects a provider-wide credential into a sandbox tool call
    (such as a repository clone) that traverses an untrusted network; measure
    whether every transport path the tool can take verifies the remote's
    identity before the credential is sent, and whether content fetched over an
    unverified path can reach code execution inside the sandbox.

