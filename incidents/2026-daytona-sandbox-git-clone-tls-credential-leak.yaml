schema_version: "1.0"
taxonomy_version: "1.0"
incident_id: 2026-daytona-sandbox-git-clone-tls-credential-leak
title: "Daytona agent sandbox daemon cloned repositories without TLS verification, exposing Git credentials (CVE-2026-54323)"
summary: >-
  Daytona, an infrastructure runtime for executing AI-generated code and agent
  workflows, shipped a sandbox daemon whose git clone path disabled TLS
  certificate verification before version 0.185.0. A clone request carrying Git
  credentials sent them over an unvalidated connection, so a network-position
  attacker could capture the credentials and serve tampered repository content
  into the sandbox (CVE-2026-54323). Fixed in 0.185.0; no exploitation reported.
date: "2026-06-09"
incident_type: hazard
status: final
confidence: confirmed
severity: moderate
severity_rationale: >-
  Credential capture reaches the user's whole Git provider account, not only one
  clone, and tampered repository content lands inside an agent execution
  sandbox; but exploitation requires an attacker-controlled network position
  (CVSS 3.1 5.9, Medium). Patched in 0.185.0 with no in-the-wild exploitation
  reported.

system:
  framework: Daytona (sandbox runtime for AI-generated code and agent workflows)
  models: []
  tools: ["git", "daytona-daemon", "sandbox"]
  vendor: Daytona
  autonomy_level: unknown

primary_failure_class: data-exfiltration
failure_classes:
  - class: data-exfiltration
    subclass: via-tool
  - class: supply-chain-compromise
    subclass: dependency
attack_vector: n-a
causation:
  entity: human
  intentionality: intentional
  timing: pre-deployment

trigger: >-
  A sandbox clone request that carried Git credentials (typically a personal
  access token or password for the user's Git provider) was routed through a
  network position the attacker controlled, such as a hostile network, poisoned
  DNS, a controlled proxy, or an attacker-influenced remote URL. Because the
  daemon's clone path skipped certificate validation on both the go-git and
  native git CLI code paths, the attacker could present any TLS certificate,
  receive the HTTP Basic Authorization header, and return repository content of
  their choosing to the sandbox.
root_cause: >-
  The daemon's git clone implementation disabled TLS certificate verification
  while the pull and push paths verified certificates, so one code path in the
  sandbox's repository-fetch tooling silently removed the transport trust
  boundary that protects credentials and fetched code. An agent runtime that
  injects provider credentials into sandbox operations inherits the weakest
  transport setting of any tool those operations call.
contributing_factors:
  - TLS verification settings were inconsistent across the clone, pull, and push code paths, so a regression in one path was not caught by the behaviour of the others.
  - Credentials supplied to sandbox clones are provider-wide tokens, so a single intercepted clone exposes every repository the token can reach.
  - Repository content fetched by the sandbox is executed by agent workflows, turning transport tampering into a code-execution supply path.
  - No explicit opt-in existed for insecure transport, so the insecure behaviour was the silent default rather than a visible configuration choice.
detection: >-
  Reported to the Daytona maintainers by an external researcher (credited in the
  GitHub advisory as DavidCarliez) and disclosed through GitHub Security Advisory
  GHSA-375h-72g4-hc9c on 2026-06-09; NVD published CVE-2026-54323 on 2026-06-23.
recovery: >-
  Daytona 0.185.0, released 2026-06-09, enforces TLS certificate verification by
  default for daemon git clones, matching the existing pull and push behaviour,
  and adds an explicit per-request option (default off) for internal Git servers
  with self-signed or private-CA certificates. Operators unable to upgrade were
  advised not to supply Git credentials to clones that may traverse untrusted
  networks.
prevention: >-
  Enforce certificate verification uniformly across every network code path a
  sandbox or agent tool uses, and make any insecure-transport exception an
  explicit, logged, per-request opt-in; scope Git credentials given to sandboxes
  to the narrowest repository and permission set, prefer short-lived tokens, and
  monitor for credential reuse from unfamiliar network ranges after sandbox
  clone activity; treat code fetched into an agent sandbox as untrusted until its
  provenance is verified.

