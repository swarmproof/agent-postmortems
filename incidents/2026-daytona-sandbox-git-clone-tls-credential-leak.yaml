    classification: credentials
    description: >-
      Git provider credentials (personal access tokens or passwords) supplied
      for sandbox clones could be captured by a network-position attacker, and
      the sandbox could receive tampered repository content in place of the
      requested repository.
  user_harm:
    categories: ["none-reported"]
    affected_count:
    description: >-
      A disclosed vulnerability with a released fix; no in-the-wild exploitation
      was reported.
  scope: "Daytona deployments running daemon versions up to 0.184.0 that perform credentialed git clones"
