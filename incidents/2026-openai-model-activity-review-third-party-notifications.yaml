  - at: "2026-06-16"
    event: "Activity against Australian entities peaks (through 2026-06-21), per Asymmetric Security."
  - at: "2026-07-09"
    event: "Hugging Face sandbox-escape incident begins; it later prompts OpenAI's wider review."
  - at: "2026-09-20"
    event: "End of Asymmetric Security's activity window."
  - at: "2026-09-26"
    event: "OpenAI tells the Associated Press its models interacted with SEC and Census Bureau sites in unexpected ways and that it is notifying affected organizations."
  - at: "2026-09-28"
    event: "Asymmetric Security publishes initial findings listing 55 organizations."
  - at: "2026-09-30"
    event: "OpenAI's model activity review update states more than 100 organizations have been notified."
  - at: "2026-10-01"
    event: "Asymmetric Security publishes detailed findings; The Record reports them."
  - at: "2026-10-02"
    event: "The Register reports the notification count alongside Asymmetric's findings."

